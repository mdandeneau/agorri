<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agorri</title>
<meta name="description" content="Agorri: your town's government in plain English. Meetings, decisions, the budget, police and fire activity, local news and who represents you, every item linked to its source.">
<meta property="og:title" content="Agorri">
<meta property="og:description" content="Government you can see. A voice they can count.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://agorri.com/">
<meta name="theme-color" content="#1B74E4">
<meta property="og:image" content="https://agorri.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --bg:#F0F2F5;--surface:#FFFFFF;--soft:#E9EBEF;--line:#E4E6EB;--ink:#050505;--ink2:#3B4452;--muted:#65676B;
  --accent:#1B74E4;--accent-ink:#FFFFFF;--accent-soft:#E7F0FD;--accent-soft-ink:#1458AD;
  --amber:#B7791F;--amber-soft:#F6EAD2;--amber-ink:#74500F;--amber-track:#EFD3A4;
  --green:#2E8B57;--green-soft:#DCEFE3;--green-ink:#1E5C3A;--red-soft:#F5E0DA;--red-ink:#7A2E1F;
  --dark:#1B1F24;--dark-ink:#FFFFFF;--scrim:rgba(20,22,26,.42);
  --map-bg:#EAF0E6;--map-road:#FFFFFF;--map-water:#CFE2EE;--map-block:#DDE5D6;
  --display:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(0,0,0,.1),0 0 0 1px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#18191A;--surface:#242526;--soft:#3A3B3C;--line:#3E4042;--ink:#E4E6EB;--ink2:#C9CCD1;--muted:#B0B3B8;
  --accent:#4599FF;--accent-ink:#0B1A2E;--accent-soft:#1F3A5F;--accent-soft-ink:#9CC6FF;
  --amber:#D9A85B;--amber-soft:#3A2C14;--amber-ink:#F0C98A;--amber-track:#5A4420;
  --green:#5FBF88;--green-soft:#1B3426;--green-ink:#A3D8B8;--red-soft:#3E231E;--red-ink:#F0A899;
  --dark:#E4E6EB;--dark-ink:#18191A;--scrim:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.04);
  --map-bg:#232B22;--map-road:#3A4438;--map-water:#1F3340;--map-block:#2C362B;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#18191A;--surface:#242526;--soft:#3A3B3C;--line:#3E4042;--ink:#E4E6EB;--ink2:#C9CCD1;--muted:#B0B3B8;
  --accent:#4599FF;--accent-ink:#0B1A2E;--accent-soft:#1F3A5F;--accent-soft-ink:#9CC6FF;
  --amber:#D9A85B;--amber-soft:#3A2C14;--amber-ink:#F0C98A;--amber-track:#5A4420;
  --green:#5FBF88;--green-soft:#1B3426;--green-ink:#A3D8B8;--red-soft:#3E231E;--red-ink:#F0A899;
  --dark:#E4E6EB;--dark-ink:#18191A;--scrim:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.04);
  --map-bg:#232B22;--map-road:#3A4438;--map-water:#1F3340;--map-block:#2C362B;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;letter-spacing:-0.02em;text-wrap:balance;line-height:1.2}
h1{font-size:30px}h2{font-size:20px}h3{font-size:17px}
p{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit;font-size:15px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface);color:var(--ink);height:46px;width:100%}
textarea{height:auto;padding:12px 14px;resize:vertical}
label{font-size:13px;font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.top-in{max-width:1180px;margin:0 auto;height:62px;display:flex;align-items:center;gap:10px;padding:0 24px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:6px;white-space:nowrap}
.brand i{width:30px;height:30px;border-radius:50%;background:var(--accent);display:inline-block}
.brand b{font-size:21px;font-weight:800;letter-spacing:-0.03em;color:var(--accent)}
.brand .town{font-size:13px;font-weight:700;color:var(--muted);padding:3px 8px;border-radius:999px;background:var(--soft);margin-left:2px}
@media (max-width:640px){.brand .town{display:none}}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{color:var(--muted);text-decoration:none;font-weight:700;font-size:15px;padding:8px 13px;border-radius:10px}
.nav a.on{color:var(--accent);background:var(--accent-soft)}
.who{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;padding:0 12px;margin-left:6px;white-space:nowrap}
.who.ok{border-color:transparent;background:var(--green-soft);color:var(--green-ink)}

.wrap{max-width:1100px;margin:0 auto;padding:20px 24px 120px;display:flex;flex-direction:column;gap:18px}
.cols{display:grid;grid-template-columns:1fr;gap:24px;align-items:start}
.cols:has(>.rail){grid-template-columns:272px minmax(0,1fr)}
.cols>.rail{grid-column:1;grid-row:1}
.cols>.main{grid-column:2;grid-row:1}
.cols:not(:has(>.rail))>.main{grid-column:1}
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.rail{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(62px + env(safe-area-inset-top,0px) + 20px)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:13px;font-weight:700;color:var(--muted)}
.muted{color:var(--muted);font-size:13px;font-weight:600}
.lead{color:var(--ink2);font-size:16px;max-width:66ch}
.card{background:var(--surface);border:1px solid transparent;box-shadow:var(--shadow);border-radius:12px;padding:16px 18px}
.card.tight{padding:14px 16px}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.tag.amber{background:var(--amber-soft);color:var(--amber-ink)}
.tag.green{background:var(--green-soft);color:var(--green-ink)}
.tag.blue{background:var(--accent-soft);color:var(--accent-soft-ink)}
.tag.red{background:var(--red-soft);color:var(--red-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:8px;font-weight:700;font-size:14px;text-decoration:none;border:0;background:var(--soft);color:var(--ink)}
.btn.sm{min-height:32px;padding:0 11px;font-size:13px;border-radius:7px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding:0 6px}
.btn.yes{background:var(--accent-soft);color:var(--accent-soft-ink)}
.btn.yes.on{background:var(--accent);color:var(--accent-ink)}
.btn.no{background:var(--amber-soft);color:var(--amber-ink)}
.btn.no.on{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.on.plain{background:var(--dark);border-color:var(--dark);color:var(--dark-ink)}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap;max-width:100%}
.seg button,.seg a{border:0;background:transparent;min-height:34px;padding:0 13px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center}
.seg .on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--ink2)}
.chips button.on{background:var(--dark);border-color:var(--dark);color:var(--dark-ink)}

.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid transparent;box-shadow:var(--shadow);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink)}
.tile .big{font-size:28px}
.tile:hover{border-color:var(--accent)}
.big{font-size:30px;font-weight:800;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.src{font-size:12px;color:var(--muted);font-weight:600}
.src a{text-decoration:none;font-weight:700}

.icard{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:16px 20px;align-items:start}
.icard .title{font-size:19px;font-weight:800;color:var(--ink);text-decoration:none;letter-spacing:-0.01em;line-height:1.25}
.icard .title:hover{color:var(--accent)}
.icard .foot{grid-column:1 / -1;display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:12px 20px;align-items:start;border-top:1px solid var(--line);padding-top:12px}
.map{width:150px;height:110px;border-radius:12px;overflow:hidden;background:var(--map-bg);display:block}
.map svg{width:100%;height:100%;display:block}
.cost{display:flex;flex-direction:column;gap:0}
.cost b{font-size:22px;font-weight:800;letter-spacing:-0.02em}
.cost span{font-size:12px;color:var(--muted);font-weight:600}
.bar{height:10px;border-radius:5px;background:var(--amber-track);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
.bar.neutral{background:var(--soft)}
.wards{display:flex;gap:4px;align-items:flex-end;height:30px}
.wards i{flex:1;background:var(--accent-soft);border-radius:3px 3px 1px 1px;display:block;min-height:3px}
.steps{display:flex;gap:0;flex-wrap:wrap}
.steps span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);padding-right:12px}
.steps i{width:9px;height:9px;border-radius:50%;background:var(--line);flex-shrink:0}
.steps .done i{background:var(--accent)}
.steps .done{color:var(--ink2)}
.steps .now i{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.steps .now{color:var(--ink)}

.list > *{padding:16px 0;border-top:1px solid var(--line)}
.list > *:first-child{border-top:0;padding-top:0}
.cal{display:flex;gap:14px;align-items:flex-start}
.date{width:52px;flex-shrink:0;text-align:center;border-radius:10px;background:var(--accent-soft);padding:6px 0;display:flex;flex-direction:column}
.date small{font-size:10px;font-weight:800;color:var(--accent-soft-ink);letter-spacing:.06em}
.date b{font-size:20px;font-weight:800;line-height:1.15}
.alert{display:flex;gap:12px;align-items:flex-start;border-left:4px solid var(--accent);padding:4px 0 4px 14px}
.alert .ic{width:34px;height:34px;border-radius:9px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink2)}
.alert.dpw{border-color:#B7791F}.alert.water{border-color:#4E86AF}.alert.schools{border-color:#8C7A5B}.alert.police{border-color:#1B1F24}
.chg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}

.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{background:var(--surface);border:1px solid transparent;box-shadow:var(--shadow);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.fact .k{font-size:12px;font-weight:700;color:var(--muted)}
.fact .v{font-size:17px;font-weight:800}
.fact .n{font-size:12px;color:var(--muted)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.hero .map{width:100%;height:220px}
.concern{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:3px 10px;align-items:center;font-size:14px}
.concern .bar{grid-column:1 / -1;height:6px;background:var(--soft)}
.concern b{text-align:right;font-variant-numeric:tabular-nums}
.sides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.note{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.note .claim{background:var(--soft);padding:12px 16px;font-size:14px}
.note .body{padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.stmt{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.stmt:first-child{border-top:0}
.groups{display:grid;grid-template-columns:62px minmax(0,1fr) 40px;gap:4px 10px;align-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.groups .bar{height:6px;background:var(--soft)}
.answer{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px}
.wardbars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:end}
.wardbars div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
.wardbars em{display:block;width:100%;background:var(--accent-soft);border-radius:6px 6px 2px 2px;font-style:normal}
.tl{display:flex;gap:12px}
.tl i{width:12px;height:12px;border-radius:50%;background:var(--line);margin-top:4px;flex-shrink:0}
.tl i.done{background:var(--accent)}
.tl i.now{background:var(--amber);box-shadow:0 0 0 4px var(--amber-soft)}
.person{display:flex;gap:12px;align-items:center}
.av{width:42px;height:42px;border-radius:50%;color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.avrow{display:flex;gap:10px;flex-wrap:wrap}
.avrow a{display:flex;flex-direction:column;align-items:center;gap:6px;width:96px;text-decoration:none;color:var(--ink);font-size:12px;font-weight:700;text-align:center;line-height:1.2}
.ring{width:84px;height:84px;position:relative;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px}
.votegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vcell{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.vcell .v{display:inline-flex;align-self:flex-start;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px}
.vcell .v.yes{background:var(--green-soft);color:var(--green-ink)}
.vcell .v.no{background:var(--amber-soft);color:var(--amber-ink)}
.quote{border-left:3px solid var(--line);padding-left:12px;color:var(--ink2);font-size:14px}

.idea{display:flex;gap:14px;align-items:flex-start}
.up{width:60px;min-height:64px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:800;font-size:15px;flex-shrink:0;font-variant-numeric:tabular-nums}
.up.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.up small{font-size:10px;font-weight:700;opacity:.8}
.reply{font-size:13px;color:var(--ink2);border-left:3px solid var(--accent);padding-left:12px}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pipe button{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted)}
.pipe button b{font-size:20px;color:var(--ink)}
.pipe button.on{border-color:var(--accent);background:var(--accent-soft)}
.rankrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:48px;padding:6px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:700;font-size:14px}
.rankrow .n{width:26px;height:26px;border-radius:50%;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;color:var(--muted)}
.rankrow.on .n{background:var(--accent);border:0;color:var(--accent-ink)}

.donut{position:relative;width:200px;height:200px;flex-shrink:0}
.donut svg{width:100%;height:100%}
.donut div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.legend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:200px}
.legend button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:6px 8px;border-radius:8px;font-size:14px;font-weight:600;text-align:left;color:var(--ink)}
.legend button.on{background:var(--soft)}
.legend i{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.dollar{display:flex;height:34px;border-radius:10px;overflow:hidden;gap:2px}
.dollar span{color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.sl{display:grid;grid-template-columns:150px minmax(0,1fr) 52px;gap:10px;align-items:center;font-size:14px}
.sl input[type=range]{height:auto;padding:0;border:0;background:transparent;accent-color:var(--accent)}
.sl b{text-align:right;font-variant-numeric:tabular-nums}
.problems{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.problems button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;padding:6px 10px}
.problems button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-soft-ink)}
.nbgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.nb{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.nb.sp{background:var(--amber-soft);border-color:transparent}
.sponsored{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--amber-ink)}
.kind{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-soft-ink)}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:20px;width:min(520px,100%);}
.sheet.wide{width:min(720px,100%);}
.sheet{max-height:calc(100vh - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
@media (min-width:641px){.scrim{align-items:center}}
.x{width:40px;height:40px;border-radius:10px;border:0;background:var(--soft);font-size:20px;font-weight:700;flex-shrink:0}
.fbcount{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;margin-left:2px}
.fbbtn{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;min-height:46px;padding:0 18px;border-radius:999px;border:0;background:var(--dark);color:var(--dark-ink);font-weight:800;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:inline-flex;align-items:center;gap:8px}
.fbitem{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.fbitem:first-child{border-top:0}
.plus{min-width:52px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:14px;flex-shrink:0;font-variant-numeric:tabular-nums}
.plus.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dark);color:var(--dark-ink);padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;z-index:60;max-width:calc(100% - 32px);opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
.toast.show{opacity:1}
.tabbar{display:none}

/* v23: left sidebar navigation */
:root{--sidew:244px}
.side{position:fixed;left:0;top:0;bottom:0;width:var(--sidew);z-index:20;display:flex;flex-direction:column;gap:4px;padding:22px 14px 18px;border-right:1px solid var(--line);background:var(--bg);overflow-y:auto}
body{padding-left:var(--sidew)}
.side-head{display:flex;flex-direction:column;gap:2px;padding:0 10px 14px}
.side .brand{margin:0}
.side .brand i{width:28px;height:28px}
.side .brand b{font-size:19px;font-weight:700}
.side .town{font-size:12px;color:var(--muted);padding-left:38px;margin-top:-2px}
.side .ask{flex:0 0 auto;max-width:none;width:100%;margin:0 0 12px;height:38px;background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.side .ask input{font-size:13.5px}
.side .nav{display:flex;flex-direction:column;gap:2px;margin:0}
.side .nav a,.sideitem{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:12px;font-size:15px;font-weight:500;color:var(--ink2);text-decoration:none;border:0;background:transparent;width:100%;text-align:left;position:relative}
.side .nav a svg,.sideitem svg{flex-shrink:0;color:var(--muted)}
.side .nav a:hover,.sideitem:hover{background:rgba(0,0,0,.045);color:var(--ink)}
.side .nav a.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.side .nav a.on svg{color:var(--accent)}
.side-x{display:flex;flex-direction:column;gap:2px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.sideitem .fbcount{margin-left:auto}
.side-foot{margin-top:auto;padding-top:14px}
.side .who{width:100%;height:40px;margin:0;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface)}
.side .who.ok{background:var(--green-soft)}
.side .askbtn{display:none}
.fbbtn{display:none}
.toast{left:calc(50% + var(--sidew) / 2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .side .nav a:hover,:root:not([data-theme="light"]) .sideitem:hover{background:rgba(255,255,255,.06)}}
:root[data-theme="dark"] .side .nav a:hover,:root[data-theme="dark"] .sideitem:hover{background:rgba(255,255,255,.06)}
/* tablet: icon rail */
@media (max-width:999px) and (min-width:641px){
  :root{--sidew:76px}
  .side{padding:20px 10px;align-items:center}
  .side .lbl,.side .brand b,.side .ask{display:none}
  .side-head{padding:0 0 12px}
  .side .askbtn{display:inline-flex;width:48px;height:48px;margin-bottom:6px}
  .side .nav a,.sideitem{width:52px;height:48px;padding:0;justify-content:center}
  .side .nav,.side-x{align-items:center}
  .sideitem .fbcount{position:absolute;top:4px;right:2px;margin:0}
  .side .who{width:56px;padding:0;font-size:11.5px}
  .side .who span{display:none}
}
/* phone: slim top bar + bottom tabs */
@media (max-width:640px){
  :root{--sidew:0px}
  body{padding-left:0}
  .side{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;width:auto;height:56px;flex-direction:row;align-items:center;gap:8px;padding:0 16px;border-right:0;border-bottom:1px solid var(--line);background:var(--surface);overflow:visible}
  .side-head{padding:0;margin-right:auto}
  .side .town,.side .nav,.side .ask,.side .lbl,#sideforum{display:none}
  .side-x,.side-foot{display:contents}
  .side .askbtn{display:inline-flex}
  .sideitem{width:36px;height:36px;padding:0;border-radius:50%;background:var(--soft);justify-content:center}
  .sideitem svg{width:18px;height:18px;color:var(--ink2)}
  .sideitem .fbcount{position:absolute;top:-4px;right:-4px;margin:0}
  .side .who{width:auto;height:34px;padding:0 12px}
  .fbbtn{display:inline-flex}
  .toast{left:50%}
}
/* v24: top bar with town + search, nav-only sidebar, feedback button back */
.side{gap:2px;padding:22px 14px 20px}
.side-foot{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);padding:0 12px}
.tbar{position:sticky;top:0;z-index:19;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.tb-row{display:flex;align-items:center;gap:12px;height:64px;padding:0 28px;max-width:1100px;margin:0 auto}
.tb-brand{display:none}
.tb-brand i{width:28px;height:28px;border-radius:50%;background:var(--accent);display:inline-block}
.townbtn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 12px 0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;flex-shrink:0}
.townbtn svg:first-child{color:var(--accent)}
.townbtn svg:last-child{color:var(--muted)}
.townbtn:hover{border-color:var(--accent)}
.tbar .ask{flex:1 1 auto;max-width:640px;margin:0 auto;height:42px;background:var(--surface);box-shadow:0 0 0 1px var(--line);padding:0 16px}
.tbar .ask input{font-size:14px}
.tbar .ask:focus-within{box-shadow:0 0 0 2px var(--accent)}
.tbicon{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink2)}
.tbicon .fbcount{position:absolute;top:-4px;right:-4px;margin:0}
.tbar .who{height:40px;margin:0;border-radius:999px;padding:0 16px;font-size:13px;font-weight:600;background:var(--surface);flex-shrink:0}
.townrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:12px 2px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.townrow b{font-size:15px;font-weight:600}
.townrow:hover b{color:var(--accent)}
.townrow.on b{color:var(--accent)}
#townq{height:42px}
.soon{background:var(--surface);border-radius:16px;padding:22px 22px 20px;box-shadow:var(--shadow)}
.soon h2{font-size:18px}
.tag.green{background:var(--green-soft);color:var(--green-ink)}
.fbbtn{display:inline-flex;right:24px;bottom:24px}
@media (max-width:999px) and (min-width:641px){.side-foot{display:none}.tb-row{padding:0 18px;gap:10px}}
@media (max-width:640px){
  .side{display:none}
  .tbar{position:static;background:var(--surface)}
  .tb-row{height:auto;flex-wrap:wrap;padding:10px 16px 12px;gap:8px}
  .tb-brand{display:inline-flex}
  .townbtn{height:36px;font-size:13.5px;margin-right:auto}
  .tbicon{width:36px;height:36px}
  .tbar .who{height:36px;padding:0 12px}
  .tbar .ask,#gask{display:flex;order:5;flex:1 1 100%;max-width:none;height:40px}
  .askbtn{display:none!important}
  .fbbtn{right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
/* v25: tooltips + friends */
#tip{position:fixed;left:0;top:0;z-index:100;max-width:260px;padding:7px 10px;border-radius:8px;background:var(--dark);color:var(--dark-ink);font-size:12px;line-height:1.4;font-weight:500;pointer-events:none;opacity:0;transform:translateY(3px);transition:opacity .12s ease-out,transform .12s ease-out;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#tip.on{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){#tip{transition:none}}
.tipicon{display:inline-flex;flex-shrink:0}
.linkbtn{border:0;background:transparent;padding:0;color:var(--accent);font-weight:600;font-size:inherit;cursor:pointer}
.linkbtn:hover{text-decoration:underline}
.fav{border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex-shrink:0;line-height:1}
.fav.me{background:var(--accent);font-size:12px}
.fav.anon{background:var(--muted);font-size:15px}
.fline{grid-column:1 / -1;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
.favs{display:inline-flex}
.favs .fav{border:2px solid var(--bg);margin-left:-6px}
.favs .fav:first-child{margin-left:0}
.frow{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line);font-size:14px}
.frow a{color:var(--ink);font-weight:600;text-decoration:none}
.frow a:hover{color:var(--accent)}
.frow b{font-weight:600}
.ftext{font-size:14px;color:var(--ink);line-height:1.45;margin:2px 0}
.prow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prow b{font-size:14px;font-weight:600}
.prow .fav{width:36px;height:36px}
.invite{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.chk{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:500;flex-wrap:wrap}
.chk input{width:auto;height:auto;margin:0}
.seg button[role=radio]{white-space:nowrap}
@media (max-width:640px){.frow{grid-template-columns:32px minmax(0,1fr)}.frow .fav{width:32px!important;height:32px!important}}
/* v27: live feed */
.livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:1px;animation:pulse 1.6s infinite alternate}
@media (prefers-reduced-motion: reduce){.livedot{animation:none}}
.post .q{font-size:14px;line-height:1.45;white-space:pre-line}
/* Police & fire */
.sos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sos a{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);min-width:0}
.sos a:hover{box-shadow:0 0 0 2px var(--accent)}
.sos b{font-size:17px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.sos span{font-size:12px;color:var(--muted);font-weight:600}
.sos b.num{white-space:nowrap;font-size:16px}
.sos b.al{font-size:14px}
.sos a.sos-911{background:var(--red-soft)}
.sos a.sos-911 b{font-size:24px;color:var(--red-ink);letter-spacing:.02em}
.sos a.sos-911 span{color:var(--red-ink)}

.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:640px){.dgrid{grid-template-columns:1fr}.sos{grid-template-columns:1fr 1fr}.sos b{font-size:15px}.sos a.sos-911 b{font-size:22px}}

/* v29: budget breakdown bar (validated categorical slots: light on #FFFFFF, dark on #242526) */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300}
.bcard{text-decoration:none;color:var(--ink)}
a.bcard:hover{box-shadow:0 0 0 2px var(--accent)}
.bcard .big{font-size:28px}
.more-l{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap}
.bbar{display:flex;gap:2px;height:18px;border-radius:5px;overflow:hidden;background:var(--surface)}
.bbar span{display:block;min-width:3px}
.bbar span:hover{filter:brightness(1.08)}
.blegend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 16px}
.blegend>span{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:2px 8px;align-items:center;font-size:13px;color:var(--ink2);min-width:0}
.blegend i{width:10px;height:10px;border-radius:3px}
.blegend .bl-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blegend b{font-size:13px;color:var(--ink)}
.blegend em{grid-column:2 / -1;font-style:normal;font-size:12px;color:var(--muted)}
.blk>.nums{margin-top:10px}
.mo-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hist{margin-top:10px;height:auto;min-height:70px}
@media (max-width:640px){.blegend{grid-template-columns:repeat(2,minmax(0,1fr))}.bcard .big{font-size:24px}}

/* v31: charts */
.moneygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;align-items:stretch}
.moneygrid .blegend{grid-template-columns:repeat(2,minmax(0,1fr))}
.moneygrid .blegend .bl-n{white-space:normal;overflow:visible}
.lcw{padding:22px 22px 0}
.lc{position:relative}
.lc svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.lc line{stroke:var(--accent);stroke-width:2;stroke-linecap:round}
.lc line.est{stroke-dasharray:4 4}
.lc-pt{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);box-sizing:border-box}
.lc-pt::after{content:'';position:absolute;inset:-10px}
.lc-pt.last{background:var(--accent)}
.lc-pt.est{background:var(--surface);border-style:dashed}
.lc-pt b{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap}
.lc-x{position:relative;height:16px;margin-top:8px}
.lc-x span{position:absolute;transform:translateX(-50%);font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
.dchart{display:flex;flex-direction:column;gap:8px}
.dc-row{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:13px}
.dc-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.dc-t{position:relative;height:12px;background:linear-gradient(var(--line),var(--line)) 0 0/1px 100% no-repeat}
.dc-t.mid{background-position:50% 0}
.dc-t i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--s1)}
.dc-t i.neg{background:var(--s2)}
.dc-row b{text-align:right;font-size:13px}
.tl{display:flex;flex-direction:column}
.tl-row{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:14px;align-items:center;padding:7px 0;text-decoration:none;color:var(--ink);font-size:13px;border-top:1px solid var(--line)}
.tl-row:first-child{border-top:0}
.tl.one .tl-row{grid-template-columns:0 minmax(0,1fr);gap:0;border:0}
a.tl-row:hover .tl-n{color:var(--accent)}
.tl-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.tl-t{position:relative;height:16px;background:linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat}
.tl-t i{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.tl-t i::after{content:'';position:absolute;inset:-8px}
.tl-now{position:absolute;top:-5px;bottom:-5px;border-left:1.5px dashed var(--muted)}
.tl-ax{border:0;padding-top:2px}
.tl-ax .tl-t{background:none;height:14px}
.tl-ax small{position:absolute;font-size:11px;color:var(--muted);font-weight:600}
.attgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 28px}
.yoy{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 28px}
.yoy-g{display:flex;flex-direction:column;gap:5px}
.yoy-r{display:flex;align-items:center;gap:8px}
.yoy-r i{display:block;height:10px;border-radius:3px;background:var(--s1);min-width:3px}
.yoy-r.last i{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--s1)}
.yoy-r b{font-size:12px;color:var(--ink)}
.yoy-k{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.yoy-k i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--s1);margin-right:6px;vertical-align:-1px}
.yoy-k i.last{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--s1)}
@media (max-width:640px){.attgrid,.yoy{grid-template-columns:1fr}.tl-row{grid-template-columns:1fr;gap:6px}.tl.one .tl-row{grid-template-columns:1fr}.tl-ax>span:first-child{display:none}.dc-row{grid-template-columns:minmax(0,110px) minmax(0,1fr) 50px}}

/* v32: home budget cards */
.hbr{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink2)}
.hbr b{color:var(--ink);font-size:13px}
.hbr input{width:100%;accent-color:var(--accent);margin:0;height:28px}
.hb-rows{display:flex;flex-direction:column}
.hb-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.hb-row:first-child,.bk-row:first-child,.gr-row:first-child{border-top:0}
.hb-n{min-width:0;color:var(--ink2);line-height:1.3}
a.more-l,.more-l{text-decoration:none}
.hb-bar{display:block;height:8px;border-radius:3px;background:var(--soft);overflow:hidden}
.hb-bar i{display:block;height:100%;border-radius:3px;background:var(--s1);min-width:3px}
.hb-bar i.req{background:transparent;box-shadow:inset 0 0 0 1.5px var(--s1)}
.hb-row b{font-size:13px;text-align:right;min-width:54px}
.bk-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px;align-items:baseline}
.bk-row .hb-bar{grid-column:1 / -1;background:none;height:9px}
.bk-row small{grid-column:1 / -1;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-key{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.bk-key i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--s1);margin-right:6px;vertical-align:-1px}
.bk-key i.req{background:transparent;box-shadow:inset 0 0 0 1.5px var(--s1)}
.gr-row{display:grid;grid-template-columns:10px minmax(0,1fr) auto 48px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.gr-row i{width:10px;height:10px;border-radius:3px}
.gr-row small{font-size:12px;color:var(--muted);text-align:right}
.chipline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.chipline .chip{padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--ink2)}

/* v33: at-a-glance cards */
.cols7{display:flex;gap:8px;align-items:flex-end;height:88px}
.cols7 div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
.cols7 .num{color:var(--ink);font-size:12px}
.cols7 em{display:block;width:100%;background:var(--accent-soft);border-radius:5px 5px 2px 2px}
.cols7 em.now{background:var(--accent)}
.yoy3{display:flex;flex-direction:column;gap:8px}
.yoy3 .yoy-g{display:grid;grid-template-columns:minmax(0,110px) minmax(0,1fr);gap:2px 10px;align-items:center}
.yoy3 .yoy-g>.muted{grid-row:span 2}
.yoy3 .yoy-r i{flex:none}
.bcard .muted b.d-up{color:var(--green-ink)}
.bcard .muted b.d-dn{color:var(--red-ink)}
.yoy-r{display:grid !important;grid-template-columns:minmax(0,1fr) 58px;gap:8px;align-items:center}
.yoy-r .trk{display:block;min-width:0}
.yoy-r .trk i{display:block;height:10px;border-radius:3px;background:var(--s1);min-width:3px}
.yoy-r.last .trk i{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--s1)}
.soc-latest{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:10px;font-size:13px;line-height:1.4}

/* v34: local news card */
.nh-rows{display:flex;flex-direction:column}
.nh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.nh:first-child{border-top:0;padding-top:2px}
.nh-t{font-weight:600;font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nh:hover .nh-t{color:var(--accent)}
.nh small{color:var(--muted);font-size:12px;white-space:nowrap}

/* v35: clean-cut Home */
.hhead{align-items:baseline}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:4px}

<button class="fbbtn" id="ideasbtn" aria-haspopup="dialog"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>Feedback forum<span class="fbcount" id="ideascount"></span></button>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================= Live data (per town, see towns.json) ================= */
let D=null,BX=null,LX=null,TOWNS=null,TOWN=null;const TCACHE={};
const TN=()=>TOWN?TOWN.name:'your town';
const TLIVE=()=>!!(TOWN&&TOWN.status==='live');
const TODAY=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();
const RR=()=>(D&&D.resident_requests)||null;
const GB=()=>(D&&D.town&&D.town.body)||'City Council';
const GBS=()=>(D&&D.town&&D.town.bodyShort)||'Council';
const MEMS=()=>(D&&D.town&&D.town.members)||'members';
const WARDS=()=>(D&&D.town&&D.town.registeredByWard)?Object.keys(D.town.registeredByWard).length:0;
const NUMW=n=>['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'][n]||String(n);
const CAP=s=>s?s[0].toUpperCase()+s.slice(1):s;
const ATT=()=>(D&&(D.attendance||D.attendance_since_2026_01_05))||{};
const ATT_FROM=()=>(D&&D.attendance_from)||'2026-01-05';
const fmtDY=s=>{if(!s)return '';const [y,m,d]=s.split('-');return `${MON[+m-1]} ${+d}, ${y}`;};
const HOMEDEF=()=>{const mh=D.budget&&D.budget.taxRate&&D.budget.taxRate.medianHome;if(mh&&mh.value)return [mh.value,'the median single-family home'];const P=HTOWN();if(P&&P.median)return [Math.round(P.median/1000)*1000,'the median sale price ('+(P.source||'').split(',')[0]+')'];return [400000,'an example value'];};
const homeVal=()=>(S.homes&&TOWN&&S.homes[TOWN.id])||HOMEDEF()[0];
const RATE=()=>{const r=D.budget&&D.budget.taxRate;return r?(r.fy27Estimate||r.fy26):null;};
const HTOWN=()=>LX&&LX.housing?(LX.housing[TOWN.id]||LX.housing.town||null):null;
const HREG=()=>LX&&LX.housing?(LX.housing.region||LX.housing.seacoast||null):null;
const OWNHOST=/(^|\.)agorri\.com$|\.pages\.dev$|^localhost$|^127\./.test(location.hostname);
function nextSunday(){const d=ld(TODAY);d.setDate(d.getDate()+((7-d.getDay())%7||7));return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
const COLORS=['#1F5F8B','#4E86AF','#7FA6C4','#B7791F','#D19A4B','#8C7A5B','#6B8FAD','#A58C5E','#9AA7B4','#C9B88A','#B8AE9C'];

/* ================= State ================= */
let S={verified:false,username:'',votes:{},follows:{},interests:{},reasons:{},rank:[],ideaVotes:{},newIdeas:[],home:777200,digest:false,posts:[],issueTab:'decisions',nbTab:'Events',dollarSel:0,body:'City Council',q:'',ward:'1',draft:'',street:'',ideaFilter:'All',ideaSort:'Top',notifs:[],notifSeen:{},town:'',townReq:{},friends:[],freq:{},friendsInit:false,hideSamples:false,shareVotes:'me',fTab:'activity',aud:'friends'};
try{const x=JSON.parse(localStorage.getItem('kc-pm')||'null');if(x)S=Object.assign(S,x);}catch(e){}
if(!S.friendsInit){S.friends=['alexr','jamiec','samo'];S.friendsInit=true;}if(!S.freq)S.freq={};
const save=()=>{try{localStorage.setItem('kc-pm',JSON.stringify(S));}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),3000);}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD=s=>{if(!s)return '';const [y,m,d]=s.split('-');if(!d)return `${MON[+m-1]}${y!=='2026'?' '+y:''}`;return `${MON[+m-1]} ${+d}${y!=='2026'?', '+y:''}`;};
const dateBox=s=>{const [y,m,d]=s.split('-');return `<span class="date"><small>${MON[+m-1].toUpperCase()}</small><b>${+d}</b></span>`;};
const money=n=>n>=1e6?'$'+(n/1e6).toFixed(n>=1e8?0:1)+'M':n>=1e3?'$'+Math.round(n/1e3)+'K':'$'+n;
const ini=name=>name.split(/\s+/).filter(w=>/^[A-Z]/.test(w)).map(w=>w[0]).slice(0,2).join('');
const av=(t,color,size)=>`<span class="av" style="background:${color};${size?`width:${size}px;height:${size}px;font-size:${Math.round(size/2.9)}px`:''}">${t}</span>`;
const UP='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
const outTag=o=>{if(!o)return '';const l=o.toLowerCase();const cls=l.startsWith('fail')||l.startsWith('denied')||l.startsWith('rejected')?'fail':l.startsWith('pass')||l.startsWith('approved')?'pass':'';return `<span class="out ${cls}">${esc(o)}</span>`;};
const cnt=id=>({s:S.votes[id]==='s'?1:0,o:S.votes[id]==='o'?1:0});
const voters=()=>D.town.registeredVoters;
const councilColor=k=>COLORS[Math.max(0,D.officials.council.findIndex(c=>c.last===k))%COLORS.length];
function futureItems(){const seen=new Set(),out=[];const nm=D.next_council_meeting;if(nm&&nm.date>=TODAY)nm.items.forEach(i=>{const k=nm.date+i.item;if(!seen.has(k)){seen.add(k);out.push({date:nm.date,item:i.item,body:GB()});}});
 D.council_meetings.forEach(m=>(m.coming_up||[]).forEach(c=>{if(c.date&&c.date>=TODAY){const k=c.date+c.item;if(!seen.has(k)){seen.add(k);out.push({date:c.date,item:c.item,body:GB()});}}}));
 return out.sort((a,b)=>a.date.localeCompare(b.date));}
function issueComments(i){const kw=i.keywords.map(k=>k.toLowerCase());const out=[];D.council_meetings.forEach(m=>(m.public_comment||[]).forEach(p=>{const t=(p.topic+' '+p.gist).toLowerCase();if(kw.some(k=>t.includes(k)))out.push({date:m.date,url:m.minutes_url,...p});}));return out.slice(0,6);}

/* ================= Requests and cases (shared) ================= */
let REQ_T=172;
const STATUSES={
 'Posted':{tone:'',rule:'Live and gathering support. Anyone can post; three reports hide an idea until it is reviewed.'},
 'Threshold met':{tone:'amber',rule:'1% of registered voters support it. Agorri delivers it to the responsible department and the elected board as written public comment, and a 30-day clock starts.'},
 'Delivered':{tone:'amber',rule:'Sent to the city through its own request process. Same 30-day clock.'},
 'Under review':{tone:'blue',rule:'A verified city account has acknowledged it.'},
 'Planned':{tone:'green',rule:'The city says it will do it, with a date or a budget line. Requires a quote or document link.'},
 'Done':{tone:'green',rule:'It happened. Linked to the proof: minutes, a photo, or a budget line.'},
 'Declined':{tone:'red',rule:'The city said no. The reason is mandatory and shown. Open for comments for 90 days.'},
 'No response':{tone:'red',rule:'30 days passed with nothing from the city. Set automatically. Only the city can clear it, by responding.'}};
const CLOCK_DAYS=30;
const ld=x=>new Date(x+'T00:00:00');function daysBetween(a,b){return Math.round((ld(b)-ld(a))/864e5);}
function liveStatus(d){if(d.officialReply)return d.status;if(d.clockStart){const left=CLOCK_DAYS-daysBetween(d.clockStart,TODAY);if(left<0)return 'No response';}return d.status;}
function clockText(d){if(!d.clockStart||d.officialReply)return '';const due=ld(d.clockStart);due.setDate(due.getDate()+CLOCK_DAYS);const left=CLOCK_DAYS-daysBetween(d.clockStart,TODAY);const ds=`${MON[due.getMonth()]} ${due.getDate()}`;return left>=0?`City response due ${ds} · ${left} day${left===1?'':'s'} left`:`No response from the city since ${ds}, ${-left} day${-left===1?'':'s'} overdue`;}
function allRequests(){const tk=(window.TALK&&TALK.ready)?tkTop().filter(x=>x.kind==='idea'&&!x.hidden).map(x=>({id:x.key,title:x.title||(x.body||'').slice(0,120),topic:(tkCtx(x.ref)||{}).label||'',status:'Posted',votes:x.vsup,sup:x.sup,on:x.supported,tk:true})):[];return tk.concat(S.newIdeas.map(d=>({...d,mine:true,status:'Posted',votes:0})).concat(((RR()&&RR().items)||[]).map((r,k)=>({id:(RR().idPrefix||'')+'r'+k,title:r[0],topic:r[1],status:'Delivered',clockStart:RR().clockStart,votes:0,origin:RR().origin}))));}
function reqVotes(d){return d.tk?(d.votes||0):(d.votes||0)+(S.ideaVotes[d.id]?1:0);}
function requestRow(d){const v=reqVotes(d),on=d.tk?!!d.on:!!S.ideaVotes[d.id],st=liveStatus(d),meta=STATUSES[st]||{tone:''},clk=clockText(d);return `<div class="idea">${d.mine?'<span class="up" style="cursor:default"><small>In</small><small>review</small></span>':`<button class="up${on?' on':''}" data-idea="${d.id}" aria-label="Support" data-tip="Support this idea and follow it. At ${REQ_T} verified supporters the city owes a public answer.">${UP}${v}</button>`}<div class="stack" style="gap:6px;flex:1;min-width:0"><div class="row" style="gap:8px"><span class="tag ${meta.tone}">${st}</span>${d.topic?`<span class="tag blue">${esc(d.topic)}</span>`:''}${on?'<span class="muted">Following</span>':''}${d.mine?'':d.tk?`<span class="ibar">${intBtn({t:'idea',id:d.id,label:d.title,href:'#talk-'+d.id},{sm:true})}<a class="cmtb${d.replies?' has':''}" href="#talk-${esc(d.id)}" aria-label="Replies" data-tip="Comments on this idea">${BUBBLE}<span>${d.replies||''}</span></a></span>`:itemBar({t:'idea',id:d.id,label:d.title,href:'#ideas'},{sm:true})}</div><b style="font-size:16px;line-height:1.3">${esc(d.title)}</b>${d.mine?'<span class="muted">'+(d.anon?'Posted anonymously. ':'')+'Only you can see this until it is reviewed, usually within a day.</span>':`<div class="stack" style="gap:4px">${st==='Posted'?`<div class="bar neutral" style="height:6px"><span style="width:${Math.round(v/REQ_T*100)}%"></span></div><span class="muted num">${d.tk?d.sup+' supporter'+(d.sup===1?'':'s')+', ':''}${v} verified · ${REQ_T-v} more verified and the city has to answer</span>`:`<span class="muted num">${v} verified supporter${v===1?'':'s'}${clk?' · <b style="color:'+(st==='No response'?'var(--red-ink)':'var(--ink)')+'">'+clk+'</b>':''}</span>`}${d.origin?`<span class="muted">${esc(d.origin)}</span>`:''}</div>`}</div></div>`;}
function topRequests(n){return allRequests().filter(d=>!d.mine).sort((a,b)=>reqVotes(b)-reqVotes(a)).slice(0,n).map(requestRow).join('');}
function similarRequests(title){const w=title.toLowerCase().split(/\W+/).filter(x=>x.length>3&&!['should','city','town','more','have','with','from','there','need','please','some',TN().toLowerCase()].includes(x));if(!w.length)return [];return allRequests().filter(d=>!d.mine).map(d=>({d,s:w.filter(x=>d.title.toLowerCase().includes(x)).length})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,3).map(x=>x.d);}
function allCases(){const out=[];D.board_meetings.forEach((m,k)=>m.items.forEach(i=>{if(i.address)out.push({...i,body:m.body,date:m.date,url:m.record_url,midx:k,street:(i.address||'').replace(/^[\d\-&,\s]+/,'').trim()});}));return out;}
function recentCases(n){return allCases().filter(c=>c.decision).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,n);}
function caseRow(c){return `<a class="cal" href="#bmeeting-${c.midx}" style="text-decoration:none;color:var(--ink)">${dateBox(c.date)}<div class="stack" style="gap:3px;min-width:0"><div class="row" style="gap:8px"><b style="font-size:15px">${esc(c.address)}</b>${c.decision?outTag(c.decision):'<span class="out">Pending</span>'}<span class="tag">${esc(c.body.replace('Zoning Board of Adjustment','Zoning').replace('Historic District Commission','Historic District'))}</span></div><p style="font-size:14px;color:var(--ink2)">${esc(c.request)}</p></div></a>`;}

/* ================= Identity ================= */
let pending=null;
function needVerify(fn){if(S.verified){fn();return;}pending=fn;const keep=panel;openVerify();panel=keep;}
function openVerify(){openSheet(`
 <div class="between" style="flex-wrap:nowrap;align-items:flex-start"><h2>Check your address to post</h2><button class="x" data-close aria-label="Close" data-tip="Close">×</button></div>
 <p style="color:var(--ink2)">Anyone can read everything here. To post, comment, or weigh in on what the city is deciding, we check that your address is in ${esc(TN())}, so the conversation stays local.</p>
 <form id="vform" class="stack"><div class="stack" style="gap:6px"><label for="vaddr">Home address</label><input id="vaddr" placeholder="Your street address, with the house number" autocomplete="street-address" required></div><div class="stack" style="gap:6px"><label for="vuser">Public username</label><input id="vuser" value="${esc(S.username||'')}" placeholder="south_end_neighbor" autocomplete="nickname" required><span class="muted">Other residents see this name. Your address is never shown.</span></div><div id="vstatus" class="tkc-err" hidden></div><button class="btn primary" type="submit">Check address</button></form>
 <div class="answer"><b>How it works:</b> we look up your address with the U.S. Census Bureau's address service to confirm it's inside ${esc(TN())}. Agorri doesn't keep your address, only a scrambled fingerprint so one address can't open more than four accounts. Next step, coming later: a code mailed to your address.</div>`);}
function openAccount(){openSheet(`<div class="between" style="flex-wrap:nowrap"><h2>${esc(S.username)}</h2><button class="x" data-close aria-label="Close" data-tip="Close">×</button></div><div class="stack" style="gap:4px"><span class="tag green" style="align-self:flex-start">${(S.vtowns&&S.vtowns[TOWN.id]&&S.vtowns[TOWN.id].method==='preview')?'Preview: address not checked':'Address checked'} · ${TN()}</span><span class="muted">Your address is private and not stored. Your username is the only thing other residents see.</span></div><div class="row"><button class="btn" id="unverify">Switch back to visitor (demo)</button><button class="btn" id="fbopen">Feedback on Agorri</button></div>`);}

/* ================= Rail blocks ================= */
function councilRail(){const c=D.officials.council;return `<a class="card stack" href="#officials" style="gap:8px;text-decoration:none;color:var(--ink)"><div class="between"><h3>Your ${esc(GB())}</h3><span class="muted">All ${c.length} ›</span></div><div class="avstack">${c.slice(0,12).map(x=>av(ini(x.name),councilColor(x.last))).join('')}</div><span class="muted">${esc(D.officials.railNote||'')}</span></a>`;}
function billRail(){if(!RATE()||!D.budget.taxDollar)return '';const bill=Math.round(homeVal()/1000*RATE());return `<a class="card stack" href="#budget" style="gap:8px;text-decoration:none;color:var(--ink)"><div class="between"><h3>Your tax bill</h3><span class="muted">Explore ›</span></div><div class="big" style="font-size:24px">$${bill.toLocaleString()}<span class="muted" style="font-size:13px"> a year, est.</span></div><div class="dollar" style="height:26px" aria-hidden="true">${D.budget.taxDollar.items.slice(0,6).map((d,k)=>`<span style="flex:${d.pct};background:${COLORS[k]}">${d.pct>=15?Math.round(d.pct)+'¢':''}</span>`).join('')}</div><span class="muted">${Math.round(D.budget.taxDollar.items[0].pct)}¢ of every dollar goes to schools</span></a>`;}
function comingRail(){const f=futureItems().slice(0,3);return `<div class="card stack" style="gap:10px"><div class="between"><h3>Coming up</h3><a class="muted" href="#home" style="text-decoration:none">All ›</a></div>${f.map(u=>`<div class="cal" style="align-items:center">${dateBox(u.date)}<span style="font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(u.item)}</span></div>`).join('')}</div>`;}
function electionRail(){return `<div class="card stack" style="gap:4px;background:var(--dark);border-color:var(--dark)"><span class="eyebrow" style="color:#9FC0DA">Tuesday, Nov 3</span><b style="color:var(--dark-ink);font-size:16px">NH General Election</b><span style="color:#C9CFD6;font-size:13px">${LX&&LX.election?esc(LX.election.hours)+' ':''}${D.town.nextCityElection?'The next city election is '+esc(D.town.nextCityElection)+'. ':''}2025 city turnout: ${D.town.turnout2025.pct}%.</span></div>`;}
function digestRail(){return `<div class="card stack" style="gap:8px"><h3>Sunday digest</h3><p class="muted">What changed and what's coming up, once a week.</p>${S.digest?`<p style="font-size:14px"><b>Subscribed.</b> <span class="muted">Next: ${nextSunday()}.</span></p>`:`<form id="dform" class="row" style="gap:8px;flex-wrap:nowrap"><label for="demail" class="sr">Email</label><input id="demail" type="email" placeholder="you@example.com" required style="height:40px"><button class="btn primary" type="submit" style="min-height:40px">Go</button></form>`}</div>`;}
function decRow(r,showBody){const d=r.d||r;return `<div class="dec"><span class="when">${fmtD(r.date)}${showBody?'<br>'+esc(r.body):''}</span><div class="stack" style="gap:4px"><div class="row" style="gap:8px"><b>${esc(d.title)}</b>${outTag(d.outcome)}${d.needs_review?'<span class="out rev" title="'+esc(d.review_note||'')+'">Record unclear</span>':''}</div><p>${esc(d.detail)}</p>${d.dissent&&d.dissent.length?`<span class="muted">${d.outcome&&d.outcome.startsWith('failed')?'Voted yes':'Voted no'}: ${d.dissent.join(', ')}</span>`:''}${d.review_note?`<span class="muted" style="color:var(--amber-ink)">${esc(d.review_note)}</span>`:''}<span class="srcline">Source: <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.body||'Meeting')} minutes</a></span></div></div>`;}

/* ================= Home ================= */
function srcAv(kind){const m={council:[GB().split(' ').map(w=>w[0]).filter(c=>/[A-Z]/.test(c)).join('').slice(0,2),'#1B74E4',GB()],planning:['PB','#4E86AF','Planning Board'],zoning:['ZB','#6B8FAD','Zoning Board of Adjustment'],historic:['HD','#8C7A5B','Historic District Commission'],resident:['R','#2E8B57','A resident request'],city:['P','#1B74E4','City government']};const x=m[kind]||m.city;return av(x[0],x[1]).replace('<span class="av"','<span class="av" data-tip="'+x[2]+'"');}
function bodyKind(b){return b===GB()||/Council|Aldermen/.test(b)?'council':/Planning/.test(b)?'planning':/Zoning/.test(b)?'zoning':/Historic/.test(b)?'historic':'city';}
function shortBody(b){return b.replace('Zoning Board of Adjustment','Zoning Board').replace('Historic District Commission','Historic District Commission');}
function meetingCard(m,k){const yes=m.decisions.filter(d=>/^pass|^approved/i.test(d.outcome||'')).length,no=m.decisions.filter(d=>/^fail|^denied|^rejected/i.test(d.outcome||'')).length;return `<article class="fc"><div class="src">${srcAv('council')}<div><b>${esc(m.body||GB())}</b><br><span class="muted">Met ${fmtD(m.date)} · ${m.decisions.length} decisions${(m.attendance.absent||[]).length?' · '+m.attendance.absent.join(', ')+' absent':''}</span></div></div><a class="t" href="#meeting-${k}">${esc(m.headline)}</a><div class="act"><span class="out pass">${yes} passed</span>${no?`<span class="out fail">${no} failed</span>`:''}<a class="muted" href="#meeting-${k}" style="text-decoration:none;font-weight:700">Full meeting ›</a></div></article>`;}
function upcomingCard(u){return `<article class="fc" style="flex-direction:row;align-items:center;gap:14px">${dateBox(u.date)}<div class="stack" style="gap:2px;min-width:0;flex:1"><span style="font-size:15px;font-weight:700;line-height:1.3">${esc(u.item)}</span><span class="muted">${u.body}${D.next_council_meeting&&u.date===D.next_council_meeting.date?' · agenda not yet posted':''}</span></div></article>`;}
function requestCard(d){const v=reqVotes(d),on=d.tk?!!d.on:!!S.ideaVotes[d.id],st=liveStatus(d),meta=STATUSES[st]||{tone:''},clk=clockText(d);return `<article class="fc"><div class="src">${srcAv('resident')}<div><b>Resident request</b><br><span class="muted">${esc(d.topic||'')}${d.clockStart?' · to the city '+fmtD(d.clockStart):''}</span></div><span class="tag ${meta.tone}" style="margin-left:auto">${st}</span></div><a class="t" href="#ideas">${esc(d.title)}</a>${clk?`<span class="muted" style="color:${st==='No response'?'var(--red-ink)':'var(--muted)'}">${clk}</span>`:''}<div class="act"><button class="btn sm${on?' primary':''}" data-idea="${d.id}">${UP} ${on?'Supported':'Support'} · ${v}</button><span class="muted">${REQ_T} needed for a required answer</span></div></article>`;}
function caseCard(c){return `<article class="fc"><div class="src">${srcAv(bodyKind(c.body))}<div><b>${esc(shortBody(c.body))}</b><br><span class="muted">${fmtD(c.date)} · ${esc(c.address)}</span></div>${c.decision?`<span style="margin-left:auto">${outTag(c.decision)}</span>`:''}</div><a class="t" href="#bmeeting-${c.midx}">${esc(c.request)}</a></article>`;}
function moments(){const out=[];const nm=D.next_council_meeting;
 if(LX){const e=LX.election;if(e&&e.date>=TODAY)out.push({date:e.date,title:'Election Day',line:(e.hours||'').replace('Polls are open ','Polls ').replace(/\.$/,'')+' · who is running',href:LX.cand?'#election':'#local',rank:0});
  (LX.notices||[]).filter(n=>n.strip&&n.date>=TODAY&&!out.some(o=>o.date===n.date&&o.title.toLowerCase()===n.strip.toLowerCase())).forEach(n=>out.push({date:n.date,title:n.strip,line:n.stripLine||n.title,href:'#local',rank:/^(Election|Hearing|Event|Closure|Roads)$/.test(n.kind)?2:3}));}

 (LX&&LX.notices||[]).filter(n=>n.oneLiner&&(!n.until||n.until>=TODAY)).forEach(n=>t.push({tag:n.kind,text:n.oneLiner,href:'#local'}));const biz=pipeline(BIZ_RX,45).filter(c=>/open|restaurant|dining|studio|grooming/i.test(c.request)).slice(0,1);biz.forEach(c=>t.push({tag:'Proposed',text:`${c.address}: ${c.request.split('. ')[0]}`,href:'#bmeeting-'+c.midx}));return t.slice(0,5);}

function budgetParts(){const B=D.budget;if(!B||!B.generalFund)return null;const ds=(B.departments||[]).filter(d=>d.fy27>0).map(d=>({name:d.short||d.name,full:d.name,v:d.fy27}));const sum=ds.reduce((x,d)=>x+d.v,0);if(ds.length<2||sum>B.generalFund*1.02)return null;ds.sort((x,y)=>y.v-x.v);const top=ds.slice(0,5),fold=ds.slice(5);const rest=B.generalFund-top.reduce((x,d)=>x+d.v,0);if(rest>B.generalFund*0.004)top.push({name:'Everything else',v:rest,other:true,fold:fold.map(d=>d.full).concat((B.departments||[]).filter(d=>!(d.fy27>0)&&d.fy26>0).map(d=>d.name)),unlisted:B.generalFund-sum>B.generalFund*0.004});return top.map((d,k)=>({...d,pct:d.v/B.generalFund*100,k}));}

function lineChart(pts,opt){opt=opt||{};if(!pts||pts.length<2)return '';const ys=pts.map(p=>p.y);let lo=Math.min(...ys),hi=Math.max(...ys);const pad=(hi-lo)*0.2||1;lo-=pad;hi+=pad*0.4;const n=pts.length;const X=i=>(i/(n-1))*100;const Y=v=>100-((v-lo)/(hi-lo))*100;const P=pts.map((p,i)=>({x:X(i),y:Y(p.y),p}));
 return `<div class="lcw"><div class="lc" style="height:${opt.h||90}px" role="img" aria-label="${esc(pts.map(p=>p.x+' '+p.label).join(', '))}"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${P.slice(1).map((s,i)=>`<line x1="${P[i].x}" y1="${P[i].y}" x2="${s.x}" y2="${s.y}" vector-effect="non-scaling-stroke"${s.p.est?' class="est"':''}></line>`).join('')}</svg>${P.map((s,i)=>`<span class="lc-pt${s.p.est?' est':''}${i===n-1?' last':''}" style="left:${s.x}%;top:${s.y}%" data-tip="${esc(s.p.tip||'')}"><b>${esc(s.p.label)}</b></span>`).join('')}</div><div class="lc-x">${P.map(s=>`<span style="left:${s.x}%">${esc(s.p.x)}</span>`).join('')}</div></div>`;}

function rollCall(v,me){const pre=v.date<ATT_FROM();const roster=pre?v.yes.concat(v.no).map(l=>({last:l,name:l})):D.officials.council.filter(c=>!c.noVote||v.yes.includes(c.last)||v.no.includes(c.last));return `<div class="stack" style="gap:6px;padding:12px 0;border-top:1px solid var(--line)"><div class="row" style="gap:8px"><b style="font-size:14px">${esc(v.title)}</b>${outTag(v.outcome)}<span class="muted">${fmtD(v.date)}${pre?' · previous council':''}</span></div><div class="rc" style="grid-template-columns:repeat(auto-fill,minmax(${roster.length>9?72:60}px,1fr))">${roster.map(c=>{const y=v.yes.includes(c.last),n=v.no.includes(c.last);return `<span class="${y?'y':n?'n':''}${me===c.last?' me':''}" title="${esc(c.name)}: ${y?'yes':n?'no':'not recorded'}">${esc(c.last)}</span>`;}).join('')}</div><span class="srcline">Source: <a href="${esc(v.url)}" target="_blank" rel="noopener">Minutes</a></span></div>`;}

 let meetings=body===GB()?D.council_meetings.map((m,k)=>({...m,idx:k,kind:'c'})):D.board_meetings.filter(b=>b.body===body).map(b=>({...b,kind:'b',idx:D.board_meetings.indexOf(b)}));

 return `

let panel=null;
function rerender(){const y=window.scrollY;route();window.scrollTo(0,y);if(panel==='ideas'&&!$('scrim').hidden){const sy=$('sheet').scrollTop;$('sheet').innerHTML=ideasPanel();$('sheet').scrollTop=sy;}}

/* ================= Sheet ================= */
let lastFocus=null;

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('scrim').hidden)closeSheet();if(e.key==='Enter'&&e.target.id==='townq'){e.preventDefault();const b=document.querySelector('#townlist [data-town]');if(b)b.click();}});

/* ================= Interactions ================= */
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.hasAttribute('data-close')){closeSheet();return;}
 if(t.id==='who'){S.verified?openAccount():openVerify();return;}
 if(t.id==='unverify'){S.verified=false;save();closeSheet();rerender();toast('You are browsing as a visitor.');return;}
 if(t.id==='fbopen'){panel=null;openFeedback();return;}
 if(t.id==='askbtn'){openAsk('');return;}
 if(t.id==='bell'){openNotifs();return;}

 if(t.id==='addfriends'||t.id==='addfriends2'||t.id==='addfriends3'){openAddFriends();return;}

 if(t.dataset.unf){const p=person(t.dataset.unf);S.friends=S.friends.filter(x=>x!==t.dataset.unf);save();rerender();toast((p?first(p):'They')+' removed. They are not notified.');return;}
 if(t.dataset.ftab){S.fTab=t.dataset.ftab;save();rerender();return;}
 if(t.hasAttribute('data-hidesamples')){S.hideSamples=!S.hideSamples;save();rerender();return;}

 if(t.dataset.audpick){const a=t.dataset.audpick;S.aud=a;save();const f=$('fpost');if(f){f.dataset.aud=a;f.querySelectorAll('[data-audpick]').forEach(b=>{const on=b.dataset.audpick===a;b.classList.toggle('on',on);b.setAttribute('aria-checked',on);});$('audhint').textContent=audHint(a);}return;}
 if(t.dataset.town){switchTown(t.dataset.town);return;}

 if(t.dataset.socsort){if(SOC.sort===t.dataset.socsort)SOC.dir=-SOC.dir;else{SOC.sort=t.dataset.socsort;SOC.dir=1;}rerender();return;}
 if(t.dataset.socplat){SOC.plat=t.dataset.socplat;rerender();return;}

 if(t.dataset.soctype){SOC.type=t.dataset.soctype;rerender();return;}
 if(t.dataset.ask){const i=$('paskq');if(i)i.value=t.dataset.ask;runAsk(t.dataset.ask);return;}
 if(t.id==='ideasbtn'||t.id==='sideforum'){openIdeasPanel();return;}

 if(t.dataset.follow){const id=t.dataset.follow;needVerify(()=>{S.follows[id]=!S.follows[id];save();rerender();if(S.follows[id]){const i=D.issues.find(x=>x.id===id);if(i)notifyIssue(i,'follow');}toast(S.follows[id]?'Following. It shows up in your Sunday digest.':'Unfollowed.');});return;}

 if(t.dataset.isort){S.ideaSort=t.dataset.isort;save();rerender();return;}

/* ================= Shared rules (built from lib/moderation.js and lib/address.js) ================= */
const MODLIB=(()=>{
// Agorri moderation policy: one definition used by /api/talk and by the page (the page shows these rules to residents).
// Change an action here to change how a category is handled: "restrict" (blocked, author can ask a person to review),
// "review" (held for a person), "nudge" (author asked to reconsider, can post anyway), or "allow".
const MOD_POLICY = {
  version: '2026-10-29',
  categories: {
    hate: { label: 'Hate or slurs', action: 'restrict', rule: 'Slurs, dehumanizing language, or attacks on people for race, ethnicity, national origin, religion, sex, gender identity, sexual orientation, disability or age.' },
    threat: { label: 'Threats or violence', action: 'restrict', rule: 'Threats, wishing harm, or encouraging violence against anyone, including officials.' },
    harassment: { label: 'Harassment', action: 'restrict', rule: 'Targeting a private person with insults, mockery or pile-ons, or naming a private person to shame them.' },
    personal_info: { label: 'Personal information', action: 'restrict', rule: 'Home addresses, phone numbers, emails, license plates or other details that identify a private person.' },
    sexual: { label: 'Sexual content', action: 'restrict', rule: 'Sexual or graphic content.' },
    spam: { label: 'Spam or ads', action: 'restrict', rule: 'Ads, scams, repeated posts, or links that have nothing to do with the town.' },
    campaigning: { label: 'Campaigning', action: 'review', rule: 'Telling people to vote for or against a candidate or party, or raising money for a campaign. Discussing a ballot question, a policy, or an official’s record is fine.' },
    national_politics: { label: 'Off-topic national politics', action: 'review', rule: 'National partisan fights with no connection to this town’s government, services or residents.' },
    accusation: { label: 'Unsupported accusation', action: 'review', rule: 'Saying a named person committed a crime or misconduct without pointing to a public source.' },
    misinformation: { label: 'Possibly false', action: 'review', rule: 'Factual claims about local government that look false and could mislead people.' },
    incivility: { label: 'Hostile tone', action: 'nudge', rule: 'Insults, name-calling or contempt aimed at other residents or officials as people rather than at their ideas or actions.' }
  },
  allowed: [
    'Any viewpoint on a local issue, including unpopular ones.',
    'Criticism of officials’ public actions, votes and statements, including sharp criticism.',
    'Strong language about policies and decisions.',
    'State or federal actions that affect this town, such as a state law, a federal grant, or immigration enforcement in town.'
  ]
};

const RANK = { allow: 0, nudge: 1, review: 2, restrict: 3 };

function modPrompt(post, town, flags) {

async function tkVerify(address,username){address=(address||'').trim();username=(username||'').trim().replace(/\s+/g,'_');

  if(r&&r.status!==404){const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Could not check that address. Try again in a minute.');tkSetResident({username:j.username,method:'address'});TALK.sig=null;await tkApiLoad();return {matched:j.matched,checked:true};}
  if(TALK.mode==='api'||!r)throw new Error('Couldn\u2019t reach the address check. Check your connection and try again.');}
 // Preview or no server: check with the Census Bureau directly when the browser allows it.
 try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),8000);const r=await fetch(ADDRLIB.censusUrl(address,TN(),TOWN.state),{signal:ctl.signal});clearTimeout(tm);if(r.ok){const res=ADDRLIB.addressInTown(await r.json(),TN(),TOWN.state);
   if(!res.ok&&res.reason==='not_found')throw new Error('We couldn’t find that address. Check the house number and street name.');if(!res.ok)throw new Error(`That address is in ${res.place||'another town'}, not ${TN()}.`);
   S.vtowns=S.vtowns||{};S.vtowns[TOWN.id]={at:new Date().toISOString(),method:'address'};S.username=username;S.verified=true;save();return {matched:res.matched,checked:true};}}
 catch(e){if(e&&e.message&&!/abort|fetch|network|Failed/i.test(e.message))throw e;}
 S.vtowns=S.vtowns||{};S.vtowns[TOWN.id]={at:new Date().toISOString(),method:'preview'};S.username=username;S.verified=true;save();return {matched:address,checked:false};}

function astem(w){return w.length>4&&/s$/.test(w)&&!/ss$/.test(w)?w.slice(0,-1):w;}
function searchRecord(q){const raw=q.toLowerCase().replace(/[^a-z0-9$ ]+/g,' ').split(/\s+/).filter(Boolean);const toks=[];const mk=(t,w)=>{const rx=(t.length<=3||/^\d+$/.test(t))?new RegExp('(^|[^a-z0-9])'+t.replace(/[$]/g,'\\$&')+'([^a-z0-9]|$)'):null;return [t,w,rx];};const tn=TN().toLowerCase();raw.forEach(w=>{if(ASK_STOP.has(w)||w===tn||(w.length<2&&!/\d/.test(w)))return;toks.push(mk(astem(w),1));(ASK_SYN[w]||[]).forEach(s=>toks.push(mk(s,.6)));});
