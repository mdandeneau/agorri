<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agorri</title>
<meta name="description" content="Agorri: your town's government in plain English. Meetings, decisions, the budget, police and fire activity, local news and who represents you, every item linked to its source.">
<meta property="og:title" content="Agorri">
<meta property="og:description" content="Government you can see. A voice they can count.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://agorri.com/">
<meta name="theme-color" content="#1B74E4">
<style>
:root{
  --bg:#F0F2F5;--surface:#FFFFFF;--soft:#E9EBEF;--line:#E4E6EB;--ink:#050505;--ink2:#3B4452;--muted:#65676B;
  --accent:#1B74E4;--accent-ink:#FFFFFF;--accent-soft:#E7F0FD;--accent-soft-ink:#1458AD;
  --amber:#B7791F;--amber-soft:#F6EAD2;--amber-ink:#74500F;--amber-track:#EFD3A4;
  --green:#2E8B57;--green-soft:#DCEFE3;--green-ink:#1E5C3A;--red-soft:#F5E0DA;--red-ink:#7A2E1F;
  --dark:#1B1F24;--dark-ink:#FFFFFF;--scrim:rgba(20,22,26,.42);
  --map-bg:#EAF0E6;--map-road:#FFFFFF;--map-water:#CFE2EE;--map-block:#DDE5D6;
  --display:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --shadow:0 1px 2px rgba(0,0,0,.1),0 0 0 1px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#18191A;--surface:#242526;--soft:#3A3B3C;--line:#3E4042;--ink:#E4E6EB;--ink2:#C9CCD1;--muted:#B0B3B8;
  --accent:#4599FF;--accent-ink:#0B1A2E;--accent-soft:#1F3A5F;--accent-soft-ink:#9CC6FF;
  --amber:#D9A85B;--amber-soft:#3A2C14;--amber-ink:#F0C98A;--amber-track:#5A4420;
  --green:#5FBF88;--green-soft:#1B3426;--green-ink:#A3D8B8;--red-soft:#3E231E;--red-ink:#F0A899;
  --dark:#E4E6EB;--dark-ink:#18191A;--scrim:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.04);
  --map-bg:#232B22;--map-road:#3A4438;--map-water:#1F3340;--map-block:#2C362B;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#18191A;--surface:#242526;--soft:#3A3B3C;--line:#3E4042;--ink:#E4E6EB;--ink2:#C9CCD1;--muted:#B0B3B8;
  --accent:#4599FF;--accent-ink:#0B1A2E;--accent-soft:#1F3A5F;--accent-soft-ink:#9CC6FF;
  --amber:#D9A85B;--amber-soft:#3A2C14;--amber-ink:#F0C98A;--amber-track:#5A4420;
  --green:#5FBF88;--green-soft:#1B3426;--green-ink:#A3D8B8;--red-soft:#3E231E;--red-ink:#F0A899;
  --dark:#E4E6EB;--dark-ink:#18191A;--scrim:rgba(0,0,0,.6);--shadow:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.04);
  --map-bg:#232B22;--map-road:#3A4438;--map-water:#1F3340;--map-block:#2C362B;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;letter-spacing:-0.02em;text-wrap:balance;line-height:1.2}
h1{font-size:30px}h2{font-size:20px}h3{font-size:17px}
p{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit;font-size:15px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface);color:var(--ink);height:46px;width:100%}
textarea{height:auto;padding:12px 14px;resize:vertical}
label{font-size:13px;font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.top-in{max-width:1180px;margin:0 auto;height:62px;display:flex;align-items:center;gap:10px;padding:0 24px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:6px;white-space:nowrap}
.brand i{width:30px;height:30px;border-radius:50%;background:var(--accent);display:inline-block}
.brand b{font-size:21px;font-weight:800;letter-spacing:-0.03em;color:var(--accent)}
.brand .town{font-size:13px;font-weight:700;color:var(--muted);padding:3px 8px;border-radius:999px;background:var(--soft);margin-left:2px}
@media (max-width:640px){.brand .town{display:none}}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{color:var(--muted);text-decoration:none;font-weight:700;font-size:15px;padding:8px 13px;border-radius:10px}
.nav a.on{color:var(--accent);background:var(--accent-soft)}
.who{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;padding:0 12px;margin-left:6px;white-space:nowrap}
.who.ok{border-color:transparent;background:var(--green-soft);color:var(--green-ink)}

.wrap{max-width:1100px;margin:0 auto;padding:20px 24px 120px;display:flex;flex-direction:column;gap:18px}
.cols{display:grid;grid-template-columns:1fr;gap:24px;align-items:start}
.cols:has(>.rail){grid-template-columns:272px minmax(0,1fr)}
.cols>.rail{grid-column:1;grid-row:1}
.cols>.main{grid-column:2;grid-row:1}
.cols:not(:has(>.rail))>.main{grid-column:1}
.main{display:flex;flex-direction:column;gap:18px;min-width:0}
.rail{display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(62px + env(safe-area-inset-top,0px) + 20px)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:13px;font-weight:700;color:var(--muted)}
.muted{color:var(--muted);font-size:13px;font-weight:600}
.lead{color:var(--ink2);font-size:16px;max-width:66ch}
.card{background:var(--surface);border:1px solid transparent;box-shadow:var(--shadow);border-radius:12px;padding:16px 18px}
.card.tight{padding:14px 16px}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.tag.amber{background:var(--amber-soft);color:var(--amber-ink)}
.tag.green{background:var(--green-soft);color:var(--green-ink)}
.tag.blue{background:var(--accent-soft);color:var(--accent-soft-ink)}
.tag.red{background:var(--red-soft);color:var(--red-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 16px;border-radius:8px;font-weight:700;font-size:14px;text-decoration:none;border:0;background:var(--soft);color:var(--ink)}
.btn.sm{min-height:32px;padding:0 11px;font-size:13px;border-radius:7px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding:0 6px}
.btn.yes{background:var(--accent-soft);color:var(--accent-soft-ink)}
.btn.yes.on{background:var(--accent);color:var(--accent-ink)}
.btn.no{background:var(--amber-soft);color:var(--amber-ink)}
.btn.no.on{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.on.plain{background:var(--dark);border-color:var(--dark);color:var(--dark-ink)}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap;max-width:100%}
.seg button,.seg a{border:0;background:transparent;min-height:34px;padding:0 13px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted);text-decoration:none;display:inline-flex;align-items:center}
.seg .on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;color:var(--ink2)}
.chips button.on{background:var(--dark);border-color:var(--dark);color:var(--dark-ink)}

.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid transparent;box-shadow:var(--shadow);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink)}
.tile .big{font-size:28px}
.tile:hover{border-color:var(--accent)}
.big{font-size:30px;font-weight:800;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.src{font-size:12px;color:var(--muted);font-weight:600}
.src a{text-decoration:none;font-weight:700}

.icard{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:16px 20px;align-items:start}
.icard .title{font-size:19px;font-weight:800;color:var(--ink);text-decoration:none;letter-spacing:-0.01em;line-height:1.25}
.icard .title:hover{color:var(--accent)}
.icard .foot{grid-column:1 / -1;display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:12px 20px;align-items:start;border-top:1px solid var(--line);padding-top:12px}
.map{width:150px;height:110px;border-radius:12px;overflow:hidden;background:var(--map-bg);display:block}
.map svg{width:100%;height:100%;display:block}
.cost{display:flex;flex-direction:column;gap:0}
.cost b{font-size:22px;font-weight:800;letter-spacing:-0.02em}
.cost span{font-size:12px;color:var(--muted);font-weight:600}
.bar{height:10px;border-radius:5px;background:var(--amber-track);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
.bar.neutral{background:var(--soft)}
.wards{display:flex;gap:4px;align-items:flex-end;height:30px}
.wards i{flex:1;background:var(--accent-soft);border-radius:3px 3px 1px 1px;display:block;min-height:3px}
.steps{display:flex;gap:0;flex-wrap:wrap}
.steps span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);padding-right:12px}
.steps i{width:9px;height:9px;border-radius:50%;background:var(--line);flex-shrink:0}
.steps .done i{background:var(--accent)}
.steps .done{color:var(--ink2)}
.steps .now i{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.steps .now{color:var(--ink)}

.list > *{padding:16px 0;border-top:1px solid var(--line)}
.list > *:first-child{border-top:0;padding-top:0}
.cal{display:flex;gap:14px;align-items:flex-start}
.date{width:52px;flex-shrink:0;text-align:center;border-radius:10px;background:var(--accent-soft);padding:6px 0;display:flex;flex-direction:column}
.date small{font-size:10px;font-weight:800;color:var(--accent-soft-ink);letter-spacing:.06em}
.date b{font-size:20px;font-weight:800;line-height:1.15}
.alert{display:flex;gap:12px;align-items:flex-start;border-left:4px solid var(--accent);padding:4px 0 4px 14px}
.alert .ic{width:34px;height:34px;border-radius:9px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--ink2)}
.alert.dpw{border-color:#B7791F}.alert.water{border-color:#4E86AF}.alert.schools{border-color:#8C7A5B}.alert.police{border-color:#1B1F24}
.chg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}

.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{background:var(--surface);border:1px solid transparent;box-shadow:var(--shadow);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.fact .k{font-size:12px;font-weight:700;color:var(--muted)}
.fact .v{font-size:17px;font-weight:800}
.fact .n{font-size:12px;color:var(--muted)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.hero .map{width:100%;height:220px}
.concern{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:3px 10px;align-items:center;font-size:14px}
.concern .bar{grid-column:1 / -1;height:6px;background:var(--soft)}
.concern b{text-align:right;font-variant-numeric:tabular-nums}
.sides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.note{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.note .claim{background:var(--soft);padding:12px 16px;font-size:14px}
.note .body{padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.stmt{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.stmt:first-child{border-top:0}
.groups{display:grid;grid-template-columns:62px minmax(0,1fr) 40px;gap:4px 10px;align-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.groups .bar{height:6px;background:var(--soft)}
.answer{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px}
.wardbars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:end}
.wardbars div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
.wardbars em{display:block;width:100%;background:var(--accent-soft);border-radius:6px 6px 2px 2px;font-style:normal}
.tl{display:flex;gap:12px}
.tl i{width:12px;height:12px;border-radius:50%;background:var(--line);margin-top:4px;flex-shrink:0}
.tl i.done{background:var(--accent)}
.tl i.now{background:var(--amber);box-shadow:0 0 0 4px var(--amber-soft)}
.person{display:flex;gap:12px;align-items:center}
.av{width:42px;height:42px;border-radius:50%;color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.avrow{display:flex;gap:10px;flex-wrap:wrap}
.avrow a{display:flex;flex-direction:column;align-items:center;gap:6px;width:96px;text-decoration:none;color:var(--ink);font-size:12px;font-weight:700;text-align:center;line-height:1.2}
.ring{width:84px;height:84px;position:relative;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px}
.votegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vcell{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.vcell .v{display:inline-flex;align-self:flex-start;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px}
.vcell .v.yes{background:var(--green-soft);color:var(--green-ink)}
.vcell .v.no{background:var(--amber-soft);color:var(--amber-ink)}
.quote{border-left:3px solid var(--line);padding-left:12px;color:var(--ink2);font-size:14px}

.idea{display:flex;gap:14px;align-items:flex-start}
.up{width:60px;min-height:64px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:800;font-size:15px;flex-shrink:0;font-variant-numeric:tabular-nums}
.up.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.up small{font-size:10px;font-weight:700;opacity:.8}
.reply{font-size:13px;color:var(--ink2);border-left:3px solid var(--accent);padding-left:12px}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pipe button{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted)}
.pipe button b{font-size:20px;color:var(--ink)}
.pipe button.on{border-color:var(--accent);background:var(--accent-soft)}
.rankrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:48px;padding:6px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:700;font-size:14px}
.rankrow .n{width:26px;height:26px;border-radius:50%;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;color:var(--muted)}
.rankrow.on .n{background:var(--accent);border:0;color:var(--accent-ink)}

.donut{position:relative;width:200px;height:200px;flex-shrink:0}
.donut svg{width:100%;height:100%}
.donut div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.legend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:200px}
.legend button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:6px 8px;border-radius:8px;font-size:14px;font-weight:600;text-align:left;color:var(--ink)}
.legend button.on{background:var(--soft)}
.legend i{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.dollar{display:flex;height:34px;border-radius:10px;overflow:hidden;gap:2px}
.dollar span{color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.sl{display:grid;grid-template-columns:150px minmax(0,1fr) 52px;gap:10px;align-items:center;font-size:14px}
.sl input[type=range]{height:auto;padding:0;border:0;background:transparent;accent-color:var(--accent)}
.sl b{text-align:right;font-variant-numeric:tabular-nums}
.problems{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.problems button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;padding:6px 10px}
.problems button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-soft-ink)}
.nbgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.nb{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.nb.sp{background:var(--amber-soft);border-color:transparent}
.sponsored{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--amber-ink)}
.kind{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-soft-ink)}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:20px;width:min(520px,100%);}
.sheet.wide{width:min(720px,100%);}
.sheet{max-height:calc(100vh - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
@media (min-width:641px){.scrim{align-items:center}}
.x{width:40px;height:40px;border-radius:10px;border:0;background:var(--soft);font-size:20px;font-weight:700;flex-shrink:0}
.fbcount{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;margin-left:2px}
.fbbtn{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;min-height:46px;padding:0 18px;border-radius:999px;border:0;background:var(--dark);color:var(--dark-ink);font-weight:800;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:inline-flex;align-items:center;gap:8px}
.fbitem{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.fbitem:first-child{border-top:0}
.plus{min-width:52px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:14px;flex-shrink:0;font-variant-numeric:tabular-nums}
.plus.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dark);color:var(--dark-ink);padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;z-index:60;max-width:calc(100% - 32px);opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
.toast.show{opacity:1}
.tabbar{display:none}
.pfoot{text-align:center;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}

@media (max-width:900px){
  .cols,.cols:has(>.rail){grid-template-columns:1fr}

let REQ_T=172;
const STATUSES={
 'Posted':{tone:'',rule:'Live and gathering support. Reviewed before it appears, usually within a day.'},
 'Threshold met':{tone:'amber',rule:'1% of registered voters support it. Agorri delivers it to the responsible department and the elected board as written public comment, and a 30-day clock starts.'},
 'Delivered':{tone:'amber',rule:'Sent to the city through its own request process. Same 30-day clock.'},

 'Declined':{tone:'red',rule:'The city said no. The reason is mandatory and shown. Open for comments for 90 days.'},

const CLOCK_DAYS=30;
const ld=x=>new Date(x+'T00:00:00');function daysBetween(a,b){return Math.round((ld(b)-ld(a))/864e5);}
function liveStatus(d){if(d.officialReply)return d.status;if(d.clockStart){const left=CLOCK_DAYS-daysBetween(d.clockStart,TODAY);if(left<0)return 'No response';}return d.status;}
function clockText(d){if(!d.clockStart||d.officialReply)return '';const due=ld(d.clockStart);due.setDate(due.getDate()+CLOCK_DAYS);const left=CLOCK_DAYS-daysBetween(d.clockStart,TODAY);const ds=`${MON[due.getMonth()]} ${due.getDate()}`;return left>=0?`City response due ${ds} · ${left} day${left===1?'':'s'} left`:`No response from the city since ${ds}, ${-left} day${-left===1?'':'s'} overdue`;}
function allRequests(){return S.newIdeas.map(d=>({...d,mine:true,status:'Posted',votes:0})).concat(((RR()&&RR().items)||[]).map((r,k)=>({id:(RR().idPrefix||'')+'r'+k,title:r[0],topic:r[1],status:'Delivered',clockStart:RR().clockStart,votes:0,origin:RR().origin})));}
function reqVotes(d){return (d.votes||0)+(S.ideaVotes[d.id]?1:0);}

function topRequests(n){return allRequests().filter(d=>!d.mine).sort((a,b)=>reqVotes(b)-reqVotes(a)).slice(0,n).map(requestRow).join('');}
function similarRequests(title){const w=title.toLowerCase().split(/\W+/).filter(x=>x.length>3&&!['should','city','town','more','have','with','from','there','need','please','some',TN().toLowerCase()].includes(x));if(!w.length)return [];return allRequests().filter(d=>!d.mine).map(d=>({d,s:w.filter(x=>d.title.toLowerCase().includes(x)).length})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,3).map(x=>x.d);}

   ${hist.length>1?`<div class="stack" style="gap:4px"><span class="muted">Rate history</span><div class="hist">${hist.map((h,k)=>`<div><span class="num" style="color:var(--ink)">$${h.rate}</span><em class="${k===hist.length-1?'now':''}" style="height:${Math.round(h.rate/mx*44)}px"></em>${esc(h.fy)}</div>`).join('')}</div>${hnote?`<span class="muted">${esc(hnote)}.</span>`:''}</div>`:''}
   <span class="srcline">${esc(r.note||'')}</span></div>
  ${B.waterSewerBill&&B.waterSewerBill.typicalMonthly?`<div class="card stack" style="gap:6px"><h3>${esc(B.waterSewerBill.title||'Water and sewer')}</h3><div class="big" style="font-size:24px">$${B.waterSewerBill.typicalMonthly}<span class="muted" style="font-size:13px"> a month</span></div><span class="muted">${B.waterSewerBill.note?esc(B.waterSewerBill.note):'Typical bill'+(B.waterSewerBill.change?', up $'+B.waterSewerBill.change:'')+'.'}${(B.enterprise||[]).length?' Separate from the General Fund: '+B.enterprise.map(e=>esc(e.name.toLowerCase())+' '+money(e.amount)).join(', ')+'.':''}</span></div>`:(B.enterprise||[]).length?`<div class="card stack" style="gap:6px"><h3>Utility funds</h3><span class="muted">Separate from the General Fund: ${B.enterprise.map(e=>esc(e.name)+' '+money(e.amount)).join(', ')}.</span></div>`:''}
  ${B.debtOutstanding&&B.debtOutstanding.fy25?`<div class="card stack" style="gap:6px"><h3>City debt</h3><div class="big" style="font-size:24px">${money(B.debtOutstanding.fy25)}</div><span class="muted">Outstanding, FY25.${B.debtOutstanding.fy24?(B.debtOutstanding.fy25>=B.debtOutstanding.fy24?' Up':' Down')+' from '+money(B.debtOutstanding.fy24)+'.':''}${debtLine&&debtLine.fy27?' Debt service is '+money(debtLine.fy27)+' of this year\'s budget.':''}</span></div>`:''}
 </aside></div>${foot()}`;}

function billSub(bill,last){const r=D.budget.taxRate||{};if(r.fy27Estimate&&last!=null)return `a year, ${bill>=last?'up':'down'} $${Math.abs(bill-last).toLocaleString()} from last year's $${r.fy26} rate`;return `a year at the ${esc(r.rateLabel||'current')} rate`;}
function ring(a,b,color){const r=34,C=2*Math.PI*r,p=b?a/b:0;return `<div class="ring"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--soft)" stroke-width="9"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="${color}" stroke-width="9" stroke-dasharray="${(C*p).toFixed(1)} ${C.toFixed(1)}" stroke-linecap="round"/></svg><b class="num">${Math.round(p*100)}%</b></div>`;}
function pageOfficials(){const O=D.officials;return `
 <section class="between"><div class="stack" style="gap:4px"><h1>Officials</h1><p class="lead">${esc(O.councilNote)}</p></div>${lookTabs('officials')}</section>
 <div class="cols"><div class="main">

  ${D.roll_call_votes.length?`<section class="stack"><h2>Roll-call votes this year</h2><p class="muted">${O.rollCallNote?esc(O.rollCallNote)+' ':''}These ${D.roll_call_votes.length} are the votes where the minutes list each member by name.</p><div class="card" style="padding-top:6px;padding-bottom:6px"><div class="list">${D.roll_call_votes.map(v=>rollCall(v)).join('')}</div></div></section>`:''}
  <section class="stack"><h2>City staff</h2><div class="cgrid">${O.staff.map(s=>`<div class="ccard">${av(ini(s.name),'#9A9A8C',44)}<span><b style="font-size:14px">${esc(s.name)}</b><br><span class="muted">${esc(s.role)}${s.since?' · since '+esc(s.since):''}</span>${s.phone?`<br><span class="muted">${esc(s.phone)}</span>`:''}</span></div>`).join('')}</div>${O.staff[0]&&O.staff[0].note?`<p class="muted">${esc(O.staff[0].note)}</p>`:''}</section>
  <section class="stack"><h2>School Board</h2><p class="muted">${esc(O.schoolBoard.note)}</p><div class="cgrid">${O.schoolBoard.members.map(m=>`<div class="ccard">${av(ini(m.name),'#8C7A5B',40)}<span><b style="font-size:14px">${esc(m.name)}</b><br><span class="muted">Term ${esc(m.term)}</span></span></div>`).join('')}</div></section>
  <section class="stack"><h2>Commissions and boards</h2><div class="list">${O.commissions.map(c=>`<div class="stack" style="gap:2px"><b>${esc(c.name)}</b><span class="muted">${c.members.map(esc).join(' · ')}</span><span class="muted">${esc(c.note)}</span></div>`).join('')}${O.boards.map(b=>`<div class="stack" style="gap:2px"><div class="row" style="gap:8px"><b>${esc(b.name)}</b><span class="tag">${esc(b.meets)}</span></div><span class="muted">${esc(b.does)}</span>${b.url?`<span class="srcline"><a href="${esc(b.url)}" target="_blank" rel="noopener">City page</a></span>`:''}</div>`).join('')}</div></section>
 </div><aside class="rail">${electionRail()}${comingRail()}</aside></div>${foot()}`;}
function rollCall(v,me){const pre=v.date<ATT_FROM();const roster=pre?v.yes.concat(v.no).map(l=>({last:l,name:l})):D.officials.council;return `<div class="stack" style="gap:6px;padding:12px 0;border-top:1px solid var(--line)"><div class="row" style="gap:8px"><b style="font-size:14px">${esc(v.title)}</b>${outTag(v.outcome)}<span class="muted">${fmtD(v.date)}${pre?' · previous council':''}</span></div><div class="rc" style="grid-template-columns:repeat(auto-fill,minmax(${roster.length>9?72:60}px,1fr))">${roster.map(c=>{const y=v.yes.includes(c.last),n=v.no.includes(c.last);return `<span class="${y?'y':n?'n':''}${me===c.last?' me':''}" title="${esc(c.name)}: ${y?'yes':n?'no':'not recorded'}">${esc(c.last)}</span>`;}).join('')}</div><span class="srcline">Source: <a href="${esc(v.url)}" target="_blank" rel="noopener">Minutes</a></span></div>`;}
function pageOfficial(k){const c=D.officials.council.find(x=>x.last===k);if(!c)return pageOfficials();const a=ATT()[k]||{present:0,total:0};const rc=D.roll_call_votes.filter(v=>v.yes.includes(k)||v.no.includes(k));const moved=D.council_meetings.flatMap(m=>m.decisions.filter(d=>d.moved_by===k).map(d=>({...d,date:m.date,url:m.minutes_url,body:m.body||GB()}))).slice(0,8);const dissents=D.council_meetings.flatMap(m=>m.decisions.filter(d=>(d.dissent||[]).includes(k)).map(d=>({...d,date:m.date,url:m.minutes_url,body:m.body||GB()})));
 return `
 <section class="stack"><a href="#officials" class="muted" style="text-decoration:none">‹ Officials</a><div class="person" style="gap:18px">${av(ini(c.name),councilColor(k),76)}<div><h1 style="font-size:30px">${esc(c.name)}</h1><p class="muted" style="font-size:15px">${esc(c.role)} · term ${esc(c.term)}</p><p style="color:var(--ink2);font-size:14px">${c.votes2025?c.votes2025.toLocaleString()+' votes in the November 2025 city election. ':''}${c.ward?'Elected by Ward '+esc(c.ward)+'.':'Elected citywide.'}</p></div></div></section>
 <div class="cols"><div class="main">
  <section class="stack"><h2>Roll-call votes</h2>${rc.length?`<div class="card" style="padding-top:6px;padding-bottom:6px">${rc.map(v=>rollCall(v,k)).join('')}</div>`:'<p class="muted">Not on the record for any roll-call vote this year.</p>'}${D.officials.rollCallNote?`<p class="muted">${esc(D.officials.rollCallNote)}</p>`:''}</section>
  ${dissents.length?`<section class="stack"><h2>Votes in the minority (${dissents.length})</h2><div class="card" style="padding-top:6px;padding-bottom:6px"><div class="list">${dissents.map(d=>decRow(d)).join('')}</div></div></section>`:''}
  <section class="stack"><h2>Motions they moved (recent)</h2>${moved.length?`<div class="card" style="padding-top:6px;padding-bottom:6px"><div class="list">${moved.map(d=>decRow(d)).join('')}</div></div>`:'<p class="muted">None recorded as mover.</p>'}</section>
  <p class="muted">We publish the record word for word, with sources. No scorecards, no characterizations${D.town.financeNote?', and '+esc(D.town.financeNote):''}.</p>
 </div><aside class="rail"><div class="card" style="display:flex;gap:16px;align-items:center">${ring(a.present,a.total,councilColor(k))}<div><b>Meeting attendance</b><br><span class="muted">${a.present} of ${a.total} ${esc(GBS().toLowerCase())} meetings since ${fmtDY(ATT_FROM())}</span></div></div><div class="card stack" style="gap:6px"><h3>Contact</h3><span class="muted">${esc(c.contact||D.town.contactNote||'Contact details are on the city roster page.')}</span><a class="btn sm" href="${esc(D.town.sources.roster)}" target="_blank" rel="noopener">City roster page</a></div>${comingRail()}</aside></div>${foot()}`;}

function pageRecord(){const ORDER=['Planning Board','Zoning Board of Adjustment','Historic District Commission'];const bb=[...new Set(D.board_meetings.map(m=>m.body))].sort((a,b)=>((ORDER.indexOf(a)+1)||99)-((ORDER.indexOf(b)+1)||99));const bodies=[GB(),...bb];const q=S.q.trim().toLowerCase();const body=bodies.includes(S.body)?S.body:GB();
 let meetings=body===GB()?D.council_meetings.map((m,k)=>({...m,idx:k,kind:'c'})):D.board_meetings.filter(b=>b.body===body).map(b=>({...b,kind:'b',idx:D.board_meetings.indexOf(b)}));
 const hits=m=>{if(!q)return null;const pool=m.kind==='c'?m.decisions.map(d=>d.title+' '+d.detail):m.items.map(i=>[i.address,i.applicant,i.request,i.decision].join(' '));return pool.filter(t=>t.toLowerCase().includes(q)).length;};
 if(q)meetings=meetings.filter(m=>hits(m)>0||(m.headline||'').toLowerCase().includes(q));
 const tot=D.topics.reduce((a,t)=>a+t.count,0),mx=D.topics[0].count;
 return `
 <section class="between"><div class="stack" style="gap:4px"><h1>Meeting record</h1><p class="lead">${D.council_meetings.length} ${esc(GB())} meetings and ${D.board_meetings.length} board meetings since ${fmtD(D.about.records_from)}, summarized in plain English and linked to the minutes.</p></div>${lookTabs('record')}</section>
 <div class="cols"><div class="main">
  <div class="row"><div class="seg">${bodies.map(b=>`<button data-body="${b}" class="${body===b?'on':''}">${b.replace('Zoning Board of Adjustment','Zoning Board').replace('Historic District Commission','Historic District')}</button>`).join('')}</div></div>
  <form id="qform" class="row" style="flex-wrap:nowrap"><label for="qin" class="sr">Search</label><input id="qin" placeholder="Search decisions and cases (try: parking, Fleet Street, variance)" value="${esc(S.q)}"><button class="btn" type="submit">Search</button>${q?'<button class="btn ghost" type="button" id="qclear">Clear</button>':''}</form>
  <div class="list">${meetings.map(m=>{const h=hits(m);return `<a class="mrow" href="#${m.kind==='c'?'meeting':'bmeeting'}-${m.idx}">${dateBox(m.date)}<span><span class="h"><b>${esc(m.headline)}</b></span><br><span class="muted">${m.kind==='c'?`${m.decisions.length} decisions · ${m.minutes_status} minutes${m.ocr?' · scanned PDF':''}`:`${m.items.length} cases · ${esc(m.record_type)}`}${h?` · <b style="color:var(--accent)">${h} match${h>1?'es':''}</b>`:''}</span></span><span class="muted" style="white-space:nowrap">Open ›</span></a>`;}).join('')||'<p class="muted">No meetings match.</p>'}</div>
 </div><aside class="rail"><div class="card stack" style="gap:8px"><h3>What the city spends its meetings on</h3><p class="muted">${tot} decisions and cases by topic, all bodies.</p>${D.topics.slice(0,8).map(t=>`<div class="topic"><span>${esc(t.topic)}</span><b>${t.count}</b><div class="bar"><span style="width:${Math.round(t.count/mx*100)}%"></span></div></div>`).join('')}</div><div class="card stack" style="gap:6px"><h3>About this record</h3><p class="muted">${esc(D.about.note)}</p></div></aside></div>${foot()}`;}
function pageMeeting(k){const m=D.council_meetings[k];if(!m)return pageRecord();return `
 <section class="stack"><a href="#record" class="muted" style="text-decoration:none">‹ Meeting record</a><div class="row" style="gap:8px"><span class="tag blue">${esc(m.body||GB())}</span><span class="tag">${fmtD(m.date)}</span><span class="tag ${m.minutes_status==='final'?'green':'amber'}">${m.minutes_status} minutes</span>${m.ocr?'<span class="tag">Scanned PDF, machine-read</span>':''}</div><h1 style="font-size:28px">${esc(m.headline)}</h1><span class="srcline">Source: <a href="${esc(m.minutes_url)}" target="_blank" rel="noopener">${m.minutes_status==='agenda only'?'Agenda':'Minutes'}</a> · Present: ${(m.attendance.present||[]).join(', ')||'not recorded'}${(m.attendance.absent||[]).length?' · Absent: '+m.attendance.absent.join(', '):''}</span></section>
 <div class="cols"><div class="main">
  <section class="stack"><h2>Decisions (${m.decisions.length})</h2><div class="card" style="padding-top:6px;padding-bottom:6px"><div class="list">${m.decisions.map(d=>decRow({...d,date:m.date,url:m.minutes_url,body:m.body||GB()})).join('')}</div></div></section>
  ${m.discussed&&m.discussed.length?`<section class="stack"><h2>Discussed, no vote</h2><div class="card" style="padding-top:6px;padding-bottom:6px"><div class="list">${m.discussed.map(d=>`<div class="stack" style="gap:3px"><div class="row" style="gap:8px"><b style="font-size:14px">${esc(d.title)}</b><span class="tag">${esc(d.topic)}</span></div><p style="font-size:14px;color:var(--ink2)">${esc(d.detail)}</p></div>`).join('')}</div></div></section>`:''}
 </div><aside class="rail">${m.public_comment&&m.public_comment.length?`<div class="card stack" style="gap:10px"><h3>Public comment</h3>${m.public_comment.map(p=>`<div class="stack" style="gap:2px"><div class="row" style="gap:6px"><b style="font-size:13px">${esc(p.topic)}</b><span class="tag">${p.speakers}</span></div><p class="muted" style="font-weight:600">${esc(p.gist)}</p></div>`).join('')}</div>`:''}${m.coming_up&&m.coming_up.length?`<div class="card stack" style="gap:8px"><h3>Scheduled at this meeting</h3>${m.coming_up.map(c=>`<div class="stack" style="gap:1px"><b style="font-size:13px">${c.date?fmtD(c.date):''}</b><span class="muted">${esc(c.item)}</span></div>`).join('')}</div>`:''}</aside></div>${foot()}`;}
function pageBoardMeeting(k){const b=D.board_meetings[k];if(!b)return pageRecord();return `
 <section class="stack"><a href="#record" class="muted" style="text-decoration:none">‹ Meeting record</a><div class="row" style="gap:8px"><span class="tag blue">${esc(b.body)}</span><span class="tag">${fmtD(b.date)}</span><span class="tag">${esc(b.record_type)}</span></div><h1 style="font-size:28px">${esc(b.headline)}</h1><span class="srcline">Source: <a href="${esc(b.record_url)}" target="_blank" rel="noopener">City record</a></span></section>

 ${b.policy_items&&b.policy_items.length?`<section class="stack"><h2>Policy items</h2><div class="card" style="padding-top:6px;padding-bottom:6px"><div class="list">${b.policy_items.map(p=>`<div class="stack" style="gap:3px"><b style="font-size:14px">${esc(p.title)}</b><p style="font-size:14px;color:var(--ink2)">${esc(p.detail)}</p></div>`).join('')}</div></div></section>`:''}</div><aside class="rail">${(()=>{const bd=D.officials.boards.find(x=>x.name===b.body);return bd?`<div class="card stack" style="gap:6px"><h3>${esc(bd.name)}</h3><p class="muted">${esc(bd.does)}</p><span class="tag">${esc(bd.meets)}</span></div>`:'';})()}</aside></div>${foot()}`;}
function pageTown(){const t=D.town;const mx=Math.max(...Object.values(t.registeredByWard));return `

 <div class="cols"><div class="main"><section class="card stack"><h2>Registered voters by ward</h2><div class="wardbars" style="height:120px">${Object.entries(t.registeredByWard).map(([w,n])=>`<div><span class="num" style="color:var(--ink)">${n.toLocaleString()}</span><em style="height:${Math.round(n/mx*90)}px"></em>Ward ${w}</div>`).join('')}</div><span class="srcline">Sources: <a href="${esc(t.sources.wards)}" target="_blank" rel="noopener">Ward list</a> · <a href="${esc(t.sources.election)}" target="_blank" rel="noopener">2025 results</a>${t.sources.voters?` · <a href="${esc(t.sources.voters)}" target="_blank" rel="noopener">Voter counts</a>`:''}</span></section>
 <section class="card stack"><h2>Why this matters here</h2><p style="color:var(--ink2)">Every support or oppose count on this site is shown as a share of these ${t.registeredVoters.toLocaleString()} voters, and as a spread across the ${NUMW(WARDS())} wards, so nobody can mistake 300 taps for the whole city.</p></section></div><aside class="rail">${electionRail()}${councilRail()}</aside></div>${foot()}`;}

function pageBeyond(){if(!BX)return `<section class="stack"><h1>County, state, federal</h1><p class="muted">The officials file didn't load.</p></section>`;const wl=Object.keys(BX.ward_reps||{}).sort((a,b)=>a-b);const w=wl.includes(S.ward)?S.ward:wl[0];const reps=(BX.ward_reps||{})[w]||[];
 return `

 <div class="cols"><div class="main">

 </div><aside class="rail"><div class="card stack" style="gap:6px;background:var(--dark);border-color:var(--dark)"><span class="eyebrow" style="color:#9FC0DA">Tuesday, Nov 3</span><b style="color:var(--dark-ink);font-size:16px">Most of these seats are on the ballot</b><span style="color:#C9CFD6;font-size:13px">${esc(BX.ballot_note)}</span></div><div class="card stack" style="gap:6px"><h3>How this list is built</h3><p class="muted">${esc(BX.note)}</p></div></aside></div>${foot()}`;}

 <div class="cols"><div class="main"><div><button class="btn primary" id="newpost">Post something</button></div>

/* ================= Staff ================= */
function pageStaff(){const nDec=D.council_meetings.reduce((n,m)=>n+m.decisions.length,0);const rev=D.council_meetings.reduce((n,m)=>n+m.decisions.filter(d=>d.needs_review).length,0);return `
 <section class="stack"><a href="#home" class="muted" style="text-decoration:none">‹ Back</a><p class="eyebrow">For city staff</p><h1>Weekly signal report</h1><p class="lead">What the city would see: Home, Issues, and Lookup as a dashboard. Staff never see or moderate Neighbors.</p></section>
 <div class="cols"><div class="main"><section class="stack"><h2>Live issues</h2><div class="list">${D.issues.map(i=>{const c=cnt(i.id),n=c.s+c.o;return `<div class="stack" style="gap:4px"><b>${esc(i.title)}</b><span class="muted">${n?`${Math.round(c.s/n*100)}% support · ${n} verified`:'No resident input yet'} · ${i.related.length} decisions on record · next: ${esc(i.next)}</span></div>`;}).join('')}</div></section>
 <section class="stack"><h2>Record quality</h2><div class="strip" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="tile"><span class="big num">${nDec}</span><span class="muted">${esc(GBS().toLowerCase())} decisions captured</span></div><div class="tile"><span class="big num">${rev}</span><span class="muted">flagged where minutes are ambiguous</span></div><div class="tile"><span class="big num">${D.council_meetings.filter(m=>m.ocr).length}</span><span class="muted">meetings read from scanned PDFs</span></div></div><p class="muted">Flags are the places the official record is ambiguous or contradicts itself. The Clerk's office could clear these quickly.</p></section></div>
 <aside class="rail"><div class="card stack"><h3>Free for every city</h3><p class="muted">Claim official accounts, answer questions, update status, post documents, and get this weekly report.</p><h3>Paid</h3><p class="muted">The full signal report, an issue workflow (route, assign, respond, close), and surveys to verified residents.</p><button class="btn" data-toast="The city account claim flow would start here.">Claim ${TN()}'s account</button></div></aside></div>${foot()}`;}
function foot(){return `<footer class="pfoot">${S.digest?`<span><b>Sunday digest:</b> subscribed. Next: ${nextSunday()}.</span>`:`<form id="dform" class="row digest" style="gap:8px;flex-wrap:nowrap;justify-content:center"><label for="demail" class="muted" style="white-space:nowrap">Sunday digest</label><input id="demail" type="email" placeholder="you@example.com" required style="height:36px;max-width:240px"><button class="btn primary sm" type="submit" style="min-height:36px">Subscribe</button></form>`}<span><b>Agorri.</b> Government you can see. A voice they can count. Independent, not affiliated with any city or town government.${D&&TLIVE()?` Built from ${D.about.documents_used} ${esc(TN())} documents as of ${fmtD(D.about.as_of)}; summaries are AI-written and every item links to its source.`:''}</span><span><button class="btn ghost sm" id="fbopen" style="min-height:24px">Feedback on Agorri</button> · <a href="#staff">For city staff</a> · <a href="https://agorri.com" target="_blank" rel="noopener">agorri.com</a></span></footer>`;}

 I.friends=I.neighbors;I.safety='<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>';
 $('nav').innerHTML=SL.map(l=>`<a href="#${l[0]}" class="${active===l[0]?'on':''}" aria-label="${l[1]}" data-tip="${TIP[l[0]]}"${active===l[0]?' aria-current="page"':''}><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[l[0]]}</svg><span class="lbl">${l[1]}</span></a>`).join('');
 $('tabbar').innerHTML=L.map(l=>`<a href="#${l[0]}" class="${(active===l[0]||((active==='social'||active==='safety')&&l[0]==='lookup'))?'on':''}" aria-label="${l[1]}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[l[0]]}</svg>${l[1]}</a>`).join('');
 const w=$('who');w.className='who'+(S.verified?' ok':'');w.innerHTML=S.verified?`✓ <span>${esc(S.username)}</span>`:'Verify';
 w.setAttribute('data-tip',S.verified?'Verified as @'+S.username+'. Your address stays private.':'Verify your address so your Support and Oppose are counted. Your address is never shown.');
 const ib=$('ideasbtn');if(ib){ib.setAttribute('data-tip','Feedback forum: residents\' ideas for the city. At '+REQ_T+' verified supporters the city owes a public answer.');ib.hidden=(h==='ideas');const n=allRequests().filter(d=>!d.mine).length;$('ideascount').textContent=n;const sc=$('sideforumcount');if(sc)sc.textContent=n;}}
let panel=null;
function rerender(){const y=window.scrollY;route();window.scrollTo(0,y);if(panel==='ideas'&&!$('scrim').hidden){const sy=$('sheet').scrollTop;$('sheet').innerHTML=ideasPanel();$('sheet').scrollTop=sy;}}

/* ================= Sheet ================= */
let lastFocus=null;

function closeSheet(){$('scrim').hidden=true;$('sheet').innerHTML='';$('sheet').classList.remove('wide');panel=null;pending=null;if(lastFocus&&lastFocus.focus)lastFocus.focus();}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('scrim').hidden)closeSheet();if(e.key==='Enter'&&e.target.id==='townq'){e.preventDefault();const b=document.querySelector('#townlist [data-town]');if(b)b.click();}});
$('scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeSheet();});
$('sheet').addEventListener('click',e=>{const a=e.target.closest('a[data-closelink]');if(a)closeSheet();});

/* ================= Interactions ================= */
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.hasAttribute('data-close')){closeSheet();return;}
 if(t.id==='who'){S.verified?openAccount():openVerify();return;}
 if(t.id==='unverify'){S.verified=false;save();closeSheet();rerender();toast('You are browsing as a visitor.');return;}
 if(t.id==='fbopen'){panel=null;openFeedback();return;}
 if(t.id==='askbtn'){openAsk('');return;}
 if(t.id==='bell'){openNotifs();return;}
 if(t.id==='townbtn'){openTownPicker();return;}
 if(t.id==='addfriends'||t.id==='addfriends2'||t.id==='addfriends3'){openAddFriends();return;}
 if(t.id==='copyinvite'){copyInvite();return;}
 if(t.dataset.addf){addFriend(t.dataset.addf);return;}
 if(t.dataset.unf){const p=person(t.dataset.unf);S.friends=S.friends.filter(x=>x!==t.dataset.unf);save();rerender();toast((p?first(p):'They')+' removed. They are not notified.');return;}
 if(t.dataset.ftab){S.fTab=t.dataset.ftab;save();rerender();return;}
 if(t.hasAttribute('data-hidesamples')){S.hideSamples=!S.hideSamples;save();rerender();return;}
 if(t.dataset.share){S.shareVotes=t.dataset.share;save();rerender();toast(S.shareVotes==='friends'?'Friends can now see how you weigh in. Public tallies still never show names.':'How you weigh in is private again.');return;}
 if(t.hasAttribute('data-sharetoggle')){S.shareVotes=S.shareVotes==='friends'?'me':'friends';save();rerender();toast(S.shareVotes==='friends'?'Friends can now see how you weigh in.':'How you weigh in is private again.');return;}
 if(t.dataset.audpick){const a=t.dataset.audpick;S.aud=a;save();const f=$('fpost');if(f){f.dataset.aud=a;f.querySelectorAll('[data-audpick]').forEach(b=>{const on=b.dataset.audpick===a;b.classList.toggle('on',on);b.setAttribute('aria-checked',on);});$('audhint').textContent=audHint(a);}return;}
 if(t.dataset.town){switchTown(t.dataset.town);return;}
 if(t.dataset.reqtown){requestTown(t.dataset.reqtown);return;}
 if(t.hasAttribute('data-reqother')){const n=t.getAttribute('data-reqother');if(n)requestTown(null,n.replace(/\b\w/g,c=>c.toUpperCase()));return;}
 if(t.id==='clearnotifs'){S.notifs=[];save();updateBell();closeSheet();return;}
 if(t.dataset.postplat){POSTF.plat=t.dataset.postplat;rerender();return;}
 if(t.dataset.socsort){if(SOC.sort===t.dataset.socsort)SOC.dir=-SOC.dir;else{SOC.sort=t.dataset.socsort;SOC.dir=1;}rerender();return;}
 if(t.dataset.socplat){SOC.plat=t.dataset.socplat;rerender();return;}
 if(t.dataset.safdept){SAF.dept=t.dataset.safdept;rerender();return;}
 if(t.dataset.soclevel){SOC.level=t.dataset.soclevel;rerender();return;}
 if(t.dataset.soctype){SOC.type=t.dataset.soctype;rerender();return;}
 if(t.dataset.ask){const i=$('paskq');if(i)i.value=t.dataset.ask;runAsk(t.dataset.ask);return;}
 if(t.id==='ideasbtn'||t.id==='sideforum'){openIdeasPanel();return;}
 if(t.dataset.vote){const id=t.dataset.id,v=t.dataset.vote;needVerify(()=>{S.votes[id]=S.votes[id]===v?null:v;if(S.votes[id])S.follows[id]=true;save();rerender();if(S.votes[id]){const i=D.issues.find(x=>x.id===id);if(i)notifyIssue(i,v==='s'?'support':'opposition');}toast(S.votes[id]?'Counted. It goes to the Council as written comment, and we\'ll tell you the outcome.':'Removed.');});return;}
 if(t.dataset.follow){const id=t.dataset.follow;needVerify(()=>{S.follows[id]=!S.follows[id];save();rerender();if(S.follows[id]){const i=D.issues.find(x=>x.id===id);if(i)notifyIssue(i,'follow');}toast(S.follows[id]?'Following. It shows up in your Sunday digest.':'Unfollowed.');});return;}
 if(t.dataset.rank){const id=t.dataset.rank;needVerify(()=>{const k=S.rank.indexOf(id);if(k>=0)S.rank=S.rank.slice(0,k);else S.rank.push(id);save();rerender();});return;}
 if(t.dataset.itab){S.issueTab=t.dataset.itab;save();if(location.hash==='#ideas')location.hash='#issues';else rerender();return;}
 if(t.dataset.idea){const id=t.dataset.idea;needVerify(()=>{S.ideaVotes[id]=!S.ideaVotes[id];save();rerender();if(S.ideaVotes[id]){const d=allRequests().find(x=>x.id===id);notifyRequest(d.title,d.id);const v=reqVotes(d);toast(liveStatus(d)==='Posted'?`Supported and following. ${REQ_T-v} more verified residents and the city has to answer.`:'Supported and following. You\'ll hear when the city responds, or when the clock runs out.');}});return;}
 if(t.dataset.isort){S.ideaSort=t.dataset.isort;save();rerender();return;}
 if(t.dataset.ifilter){S.ideaFilter=t.dataset.ifilter;save();rerender();return;}
 if(t.dataset.merge){const id=t.dataset.merge;needVerify(()=>{S.ideaVotes[id]=true;S.draft='';save();rerender();toast('Added your support to the existing idea. It now has one more verified supporter.');});return;}
 if(t.id==='newidea'){$('ideaform').hidden=false;$('newidea').hidden=true;$('ititle').focus();return;}
 if(t.id==='sclear'){S.street='';save();rerender();return;}
 if(t.id==='cancelidea'){S.draft='';save();$('ideaform').hidden=true;$('newidea').hidden=false;return;}
 if(t.dataset.dollar){S.dollarSel=+t.dataset.dollar;save();rerender();return;}
 if(t.dataset.body){S.body=t.dataset.body;save();rerender();return;}
 if(t.dataset.ward){S.ward=t.dataset.ward;save();rerender();return;}
 if(t.id==='qclear'){S.q='';save();rerender();return;}
 if(t.dataset.nb){S.nbTab=t.dataset.nb;save();rerender();return;}

function copyText(v,msg){try{navigator.clipboard.writeText(v).then(()=>toast(msg),()=>toast(v));}catch(err){toast(v);}}
function askIssue(i,q){const w=q.toLowerCase().split(/\W+/).filter(x=>x.length>3);let best=null,bs=0;const pool=i.related.map(r=>({t:r.d.title+' '+r.d.detail,d:r.d,r})).concat(i.points.map(p=>({t:p,p})));pool.forEach(x=>{const tl=x.t.toLowerCase();const s=w.filter(k=>tl.includes(k)).length;if(s>bs){bs=s;best=x;}});if(!best||bs===0)return null;
 if(best.d)return `<b>${esc(best.d.title)}</b> ${outTag(best.d.outcome)}<p style="margin-top:6px">${esc(best.d.detail)}</p><p class="srcline" style="margin-top:6px">Source: <a href="${esc(best.r.url)}" target="_blank" rel="noopener">${esc(best.r.body)} minutes, ${fmtD(best.r.date)} (PDF)</a></p>`;
 return `<p>${esc(best.p)}</p><p class="srcline" style="margin-top:6px">Source: ${i.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join(' · ')}</p>`;}
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
 if(f.id==='vform'){const u=$('vuser').value.trim().replace(/\s+/g,'_').slice(0,24)||'neighbor';S.verified=true;S.username=u;save();const fn=pending;pending=null;const wasPanel=panel;$('scrim').hidden=true;$('sheet').innerHTML='';rerender();toast('Verified. You can weigh in now.');if(fn)fn();if(wasPanel==='ideas'&&$('scrim').hidden)openIdeasPanel();return;}
 if(f.id==='fpost'){const text=$('fptext').value.trim();if(!text)return;const aud=f.dataset.aud||'friends';needVerify(()=>{S.posts.unshift({tab:aud==='friends'?null:S.nbTab,text,aud,at:new Date().toISOString()});save();rerender();toast(aud==='friends'?'Posted to your friends.':aud==='anon'?'Submitted anonymously. It appears after review, usually within a day.':'Submitted for review. It appears as @'+S.username+' within a day.');});return;}
 if(f.id==='gask'){const q=$('gaskq').value.trim();if(q){openAsk(q);$('gaskq').value='';}return;}

function logBlock(logs){if(!logs.length)return '';const g=logs[0];const mx=Math.max(1,...(g.top||[]).map(t=>t[1]));const days=logs.slice(0,7).reverse();const mc=Math.max(1,...days.map(x=>x.calls||0));
 return `<div class="card stack" style="gap:14px"><div class="between"><div class="stack" style="gap:2px"><b>${ld(g.date).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</b><span class="muted">${g.calls!=null?g.calls+' calls logged':'Calls logged'}${g.arrests!=null?' · '+g.arrests+' arrest'+(g.arrests===1?'':'s'):''}</span></div>${g.url?`<a class="btn sm" href="${esc(g.url)}" target="_blank" rel="noopener" data-tip="The department's own log for this day">Full log ↗</a>`:''}</div>
 <div class="stack" style="gap:8px">${(g.top||[]).map(t=>`<div class="concern"><span>${esc(t[0])}</span><b>${t[1]}</b><div class="bar"><span style="width:${Math.round(t[1]/mx*100)}%"></span></div></div>`).join('')}</div>

function pageSafety(){const SF=LX&&LX.safety;if(!SF)return `<section class="stack" style="gap:4px"><h1>Police and fire</h1><p class="muted">Police and fire activity isn't connected for ${esc(TN())} yet.</p></section>${foot()}`;

const NSTOP=new Set('the a an and or of to in on for with at by from is are be this that it its as into about should city council aldermen alderman board new more most'.split(' '));
function kwords(s){const tn=TN().toLowerCase();return [...new Set(String(s||'').toLowerCase().replace(/[^a-z0-9 ]+/g,' ').split(/\s+/).filter(w=>w.length>3&&!NSTOP.has(w)&&w!==tn).map(w=>w.replace(/s$/,'')))];}
function meetingMatches(words){const past=[],ahead=[];const hit=t=>{const l=String(t||'').toLowerCase();return words.filter(w=>l.includes(w)).length;};
 D.council_meetings.forEach((m,k)=>{(m.decisions||[]).forEach(d=>{const s=hit(d.title+' '+d.detail);if(s>=2)past.push({s,date:m.date,title:d.title,outcome:d.outcome,href:'#meeting-'+k});});(m.discussed||[]).forEach(d=>{const s=hit(d.title+' '+d.detail);if(s>=2)past.push({s,date:m.date,title:d.title,outcome:'discussed',href:'#meeting-'+k});});});
 futureItems().forEach(u=>{const s=hit(u.item);if(s>=1)ahead.push({s,date:u.date,title:u.item,href:'#meeting-0'});});
 past.sort((a,b)=>b.s-a.s||b.date.localeCompare(a.date));ahead.sort((a,b)=>b.s-a.s||a.date.localeCompare(b.date));return {past:past.slice(0,3),ahead:ahead.slice(0,2)};}
function pushNotif(key,title,body,href){if(S.notifs.some(n=>n.key===key))return false;S.notifs.unshift({key,at:new Date().toISOString(),title,body,href,read:false});S.notifs=S.notifs.slice(0,50);save();updateBell();return true;}
function notifyIssue(i,what){const r=i.related||[];const latest=r.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];const ahead=futureItems().filter(u=>i.keywords.some(k=>u.item.toLowerCase().includes(k.toLowerCase()))).slice(0,2);
 const parts=[];if(latest)parts.push(`On the record: ${r.length} ${GBS()} decision${r.length===1?'':'s'}, latest ${fmtD(latest.date)}: ${latest.d?latest.d.title:latest.title||''}`);ahead.forEach(u=>parts.push(`Coming up ${fmtD(u.date)}: ${u.item}`));
 if(!parts.length)return;pushNotif('issue:'+i.id,`Your ${what} on "${i.title}" lines up with the ${GBS()}'s calendar`,parts.join(' · '),'#issue-'+i.id);}
function notifyRequest(title,id){const m=meetingMatches(kwords(title));const parts=[];m.past.forEach(p=>parts.push(`${fmtD(p.date)}: ${p.title} (${p.outcome})`));m.ahead.forEach(a=>parts.push(`Coming up ${fmtD(a.date)}: ${a.title}`));if(!parts.length)return;pushNotif('req:'+id,`Your request "${title}" matches items the ${GBS()} has handled or scheduled`,parts.join(' · '),'#ideas');}
function sweepNotifs(){if(!D)return;D.issues.forEach(i=>{if(S.votes[i.id]||S.follows[i.id]){const ahead=futureItems().filter(u=>i.keywords.some(k=>u.item.toLowerCase().includes(k.toLowerCase())));ahead.forEach(u=>pushNotif('up:'+i.id+':'+u.date+':'+u.item.slice(0,30),`"${i.title}" is on the ${fmtD(u.date)} agenda`,u.item,'#issue-'+i.id));}});
 S.newIdeas.forEach(d=>notifyRequest(d.title,d.id));allRequests().filter(d=>S.ideaVotes[d.id]).forEach(d=>notifyRequest(d.title,d.id));}
function updateBell(){const n=S.notifs.filter(x=>!x.read).length;const c=$('bellcount');if(!c)return;c.hidden=!n;c.textContent=n;}
function ago(iso){const s=(Date.now()-new Date(iso).getTime())/1000;if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}
function openNotifs(){openSheet(`<div class="between" style="flex-wrap:nowrap;align-items:flex-start"><div class="stack" style="gap:2px"><h2>Your notifications</h2><p class="muted">Only you see these. They fire when something you weighed in on matches a meeting item, past or upcoming.</p></div><button class="x" data-close aria-label="Close" data-tip="Close">×</button></div>
 ${S.notifs.length?`<div class="stack" style="gap:0">${S.notifs.map(n=>`<a class="hit" href="${esc(n.href)}" data-closelink style="${n.read?'':'background:var(--accent-soft);margin:0 -10px;padding:10px'}"><span class="muted">${ago(n.at)}</span><b>${esc(n.title)}</b><span class="d">${esc(n.body)}</span></a>`).join('')}</div><div><button class="btn ghost sm" id="clearnotifs">Clear all</button></div>`:'<p class="muted">Nothing yet. Support or oppose an issue, follow one, or post a request, and you will hear here when it comes up at a meeting.</p>'}`);
 S.notifs.forEach(n=>n.read=true);save();updateBell();}

(function(){const tip=document.createElement('div');tip.id='tip';tip.setAttribute('role','tooltip');tip.setAttribute('aria-hidden','true');document.body.appendChild(tip);let tm=null,cur=null;
 function place(el){const r=el.getBoundingClientRect();const tw=tip.offsetWidth,th=tip.offsetHeight;let x,y;if(el.closest('.side')){x=r.right+10;y=r.top+r.height/2-th/2;}else{x=r.left+r.width/2-tw/2;y=r.bottom+8;if(y+th>innerHeight-8)y=r.top-th-8;}x=Math.max(8,Math.min(x,innerWidth-tw-8));y=Math.max(8,Math.min(y,innerHeight-th-8));tip.style.left=x+'px';tip.style.top=y+'px';}

 function hide(){clearTimeout(tm);tip.classList.remove('on');cur=null;}
 if(matchMedia('(hover: hover)').matches){document.addEventListener('mouseover',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el){if(el!==cur)show(el,260);}else if(cur)hide();});document.addEventListener('mouseleave',hide);}

async function fetchBlueskyLive(s){const r=await fetch('https://public.api.bsky.app/xrpc/app.bsky.feed.getAuthorFeed?actor='+encodeURIComponent(s.actor)+'&limit=15&filter=posts_no_replies');if(!r.ok)return [];const j=await r.json();

async function loadLiveFeed(){if(!TLIVE()||!LX)return;let items=null,updated=null;

 allRequests().forEach(r=>idxAdd(o,'Community feedback forum request',r.title,(r.topic||'')+'. Status: '+liveStatus(r)+'. '+reqVotes(r)+' verified supporters.','#ideas',''));

  const e=LX.election;if(e)idxAdd(o,'Election Day','Where and when to vote on Election Day, Tuesday, November 3, 2026',e.hours+' '+e.hoursNote+' Polling places: '+e.polls.map(p=>'Ward '+p.ward+': '+p.place).join('; ')+'. '+e.absentee+' '+e.sameDay+' '+e.clerk,'#local',e.date,900);

function astem(w){return w.length>4&&/s$/.test(w)&&!/ss$/.test(w)?w.slice(0,-1):w;}
function searchRecord(q){const raw=q.toLowerCase().replace(/[^a-z0-9$ ]+/g,' ').split(/\s+/).filter(Boolean);const toks=[];const mk=(t,w)=>{const rx=(t.length<=3||/^\d+$/.test(t))?new RegExp('(^|[^a-z0-9])'+t.replace(/[$]/g,'\\$&')+'([^a-z0-9]|$)'):null;return [t,w,rx];};const tn=TN().toLowerCase();raw.forEach(w=>{if(ASK_STOP.has(w)||w===tn||(w.length<2&&!/\d/.test(w)))return;toks.push(mk(astem(w),1));(ASK_SYN[w]||[]).forEach(s=>toks.push(mk(s,.6)));});
 const ph=raw.filter(w=>!ASK_STOP.has(w)).join(' ');if(!toks.length)return[];const money=/\b(spend|spending|cost|costs|budget|tax|taxes|money|pay|paid|rate)\b/.test(q.toLowerCase());const out=[];
 buildIndex().forEach(it=>{let s=0;const tl=it.title.toLowerCase();toks.forEach(([t,w,rx])=>{const inT=rx?rx.test(tl):tl.includes(t),inL=rx?rx.test(it.lc):it.lc.includes(t);if(inT)s+=3*w;else if(inL)s+=w;});if(ph.length>5&&it.lc.includes(ph))s+=6;if(money&&/budget|tax rate/i.test(it.kind))s+=2;if(s>0)out.push({it,s});});
 out.sort((a,b)=>b.s-a.s||String(b.it.date).localeCompare(String(a.it.date)));return out.slice(0,10).map(x=>x.it);}
function askPanel(q){return `<div class="between" style="flex-wrap:nowrap;align-items:flex-start"><div class="stack" style="gap:2px"><h2>Ask about ${TN()}</h2><p class="muted">Answers come only from the record on this site. Every answer links to what it used.</p></div><button class="x" data-close aria-label="Close" data-tip="Close">×</button></div>
 <form id="pask" class="ask big" role="search">${'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>'}<input id="paskq" value="${esc(q)}" placeholder="Who is my state senator?" autocomplete="off" aria-label="Your question"><button class="btn primary sm" type="submit">Ask</button></form>

 <div id="askbody" class="stack" style="gap:14px"></div>`;}

async function runAsk(q){q=(q||'').trim();if(!q)return;const body=$('askbody');if(!body)return;const other=(TOWNS||[]).find(t=>(!TOWN||t.id!==TOWN.id)&&new RegExp('\\b'+t.name.toLowerCase()+'\\b').test(q.toLowerCase()));const sw=other?`<div class="answer between" style="gap:10px"><span>Asking about <b>${esc(other.name)}</b>?${other.status==='live'?'':' It is not live yet.'}</span><button type="button" class="btn sm primary" data-town="${other.id}">Switch to ${esc(other.name)}</button></div>`:'';
 if(!TLIVE()){body.innerHTML=sw+`<p class="muted">Agorri isn't live in ${esc(TN())} yet, so there is no record to search. Switch to a live town to ask.</p>`;return;}if(askCtl)askCtl.abort();askCtl=new AbortController();const sig=askCtl.signal;const hits=searchRecord(q);
 body.innerHTML=sw+`<div class="askq"><span class="muted">You asked</span><b>${esc(q)}</b></div><div class="answer stack" id="askans" style="gap:8px"><span class="muted" id="askstate"></span><div id="asktext"></div></div><section class="stack" style="gap:8px"><div class="between"><h3>From the record</h3><span class="muted">${hits.length?hits.length+' matching records':''}</span></div>${hits.length?`<div class="stack" style="gap:0">${hits.map((h,i)=>`<a class="hit" href="${h.href}" data-closelink><span class="muted">[${i+1}] ${esc(h.kind)}${h.date?' · '+esc(adate(h.date)):''}</span><b>${esc(h.title)}</b>${h.text?`<span class="d">${esc(h.text.slice(0,170))}${h.text.length>170?'…':''}</span>`:''}</a>`).join('')}</div>`:'<p class="muted">Nothing in the record matches those words. Try a street name, a topic like parking or zoning, or an official\'s name.</p>'}</section>`;
 const st=$('askstate'),tx=$('asktext');
 if(!hits.length){st.textContent='Nothing in the record matches that question, so there is nothing to answer from. Try different words.';return;}
 if(!FB.sample){if(window.ASKOFF){st.textContent='The matching records are below.';return;}st.innerHTML='<span class="pulse"></span>Reading the record…';try{const r=await fetch('/api/ask',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question:q,town:TN()+', '+(TOWN?TOWN.stateName:''),today:TODAY,records:hits.map(h=>`${h.kind}${h.date?' ('+h.date+')':''}: ${h.title}. ${h.text}`)}),signal:sig});if(r.status===503||r.status===404||r.status===405)window.ASKOFF=true;const j=r.ok?await r.json():null;if(sig.aborted)return;if(j&&j.text){st.textContent='';tx.textContent=j.text;}else st.textContent='The matching records are below.';}catch(e){if(!sig.aborted)st.textContent='The matching records are below.';}return;}

 const prompt=ASK_RULES()+'\n\nRECORDS:\n'+hits.map((h,i)=>`[${i+1}] ${h.kind}${h.date?' ('+h.date+')':''}: ${h.title}. ${h.text}`).join('\n')+'\n\nQUESTION: '+q;
 try{const r=await FB.sample(prompt,{modelTier:'quick',signal:sig,onText:({text})=>{if(sig.aborted)return;st.textContent='';tx.textContent=text;}});if(sig.aborted)return;if(r.truncated)st.textContent='Cut short. Ask something narrower.';}
 catch(e){if(sig.aborted||!e||e.code==='cancelled')return;if(e.text)tx.textContent=e.text;const M={not_granted:'Written answers are off for this view. The matching records are below.',sampling_disabled:'Written answers are not available on this account. The matching records are below.',rate_limited:'Too many questions at once. Wait a minute and try again.',refused:'That question could not be answered here. The matching records are below.'};st.textContent=M[e.code]||'The answer did not come through. The matching records are below.';if(e.code==='not_granted'||e.code==='sampling_disabled'||e.code==='not_declared')FB.sample=null;}}
