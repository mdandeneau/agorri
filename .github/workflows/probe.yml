name: Probe (temporary)
on:
  push:
    branches: [dover-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node ingest/probe.mjs "https://publicrecords.dover.nh.gov/Cabinet/Read?AccessCode=1&DeptNumber=0&CabName=Public_Meetings&index=public_body&autosearch=City%20Council&Grid-sort=date-desc"
