name: Check data and pages

# Runs on every push and pull request: scripts/check.mjs (data shapes, freshness, cross-section consistency) and
# scripts/scan.mjs (renders every page of every live town headless and fails on errors, leaks, dead links, wrong wording).
# Stale data is a warning, not an error: the daily refresh cannot always reach every town source, and a stale
# section should not turn CI red. Run `node scripts/check.mjs --strict` by hand to see staleness as errors.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Data check
        run: node scripts/check.mjs
      - name: Install Playwright
        run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Page scan
        run: node scripts/scan.mjs --quiet
