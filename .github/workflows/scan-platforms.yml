name: Scan town platforms

# Finds each launch-region town's website and platform (ingest/scan.mjs) and commits ingest/platforms.json.
# Run by hand from the Actions tab when adding towns or when a town changes websites.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node ingest/scan.mjs
      - name: Commit results
        run: |
          git config user.name "agorri-fetcher"
          git config user.email "actions@users.noreply.github.com"
          git add ingest/platforms.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -q -m "Platform scan $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
